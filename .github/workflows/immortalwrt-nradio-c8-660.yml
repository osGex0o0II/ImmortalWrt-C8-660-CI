# ImmortalWrt 固件编译 — NRadio C8-660 (MT7981)
name: ImmortalWrt NRadio C8-660

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: NRADIO-C8-660
  WRT_THEME: aurora
  WRT_NAME: NRadio-C8-660
  WRT_SSID: NRadio-WiFi
  WRT_WORD: password
  WRT_IP: 192.168.1.1
  WRT_PW: password
  WRT_REPO: https://github.com/immortalwrt/immortalwrt
  WRT_BRANCH: master
  WRT_SOURCE: immortalwrt

jobs:
  build:
    name: immortalwrt-c8-660
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox
          sudo -E apt -yqq update
          sudo -E apt -yqq full-upgrade
          sudo -E apt -yqq autoremove --purge
          sudo -E apt -yqq autoclean
          sudo -E apt -yqq clean
          sudo -E apt -yqq install dos2unix libfuse-dev
          curl -fsSL "https://build-scripts.immortalwrt.org/init_build_environment.sh" -o /tmp/init_build_env.sh
          sudo bash /tmp/init_build_env.sh
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=${WRT_SOURCE%%/*}" >> $GITHUB_ENV
          echo "WRT_TARGET=$(grep -m 1 -oP '^CONFIG_TARGET_\K[\w]+(?=\=y)' ./Config/$WRT_CONFIG.txt)" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

      - name: Apply Patches
        run: |
          if [ -d "$GITHUB_WORKSPACE/patches" ]; then
            echo "=== APPLYING PATCHES ==="
            cp -vf $GITHUB_WORKSPACE/patches/*.dts ./wrt/target/linux/mediatek/dts/ 2>/dev/null || true
            cat $GITHUB_WORKSPACE/patches/*.mk >> ./wrt/target/linux/mediatek/image/filogic.mk 2>/dev/null || true
            echo "=== PATCHES APPLIED ==="
          fi

      - name: Verify DTS
        run: |
          for DTS in ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts; do
            if [ -f "$DTS" ]; then echo "OK: Found $DTS";
            else echo "WARN: Missing $DTS"; fi
          done
          grep -q "nradio_c8-660" ./wrt/target/linux/mediatek/image/filogic.mk && echo "OK: Device added to filogic.mk" || echo "WARN: Device NOT in filogic.mk"

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iname "*.sh" -exec dos2unix {} \; -exec chmod +x {} \;
          find ./ -maxdepth 3 -type f -iname "*.txt" -exec dos2unix {} \;

      - name: Check Caches
        id: check-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/feeds
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*
            ./wrt/dl

      - name: Update Caches
        run: |
          if [ -d "./wrt/staging_dir" ]; then
            find "./wrt/staging_dir" -type d -name "stamp" -not -path "*target*" | while read -r DIR; do
              find "$DIR" -type f -exec touch {} +
            done

            mkdir -p ./wrt/tmp && echo "1" > ./wrt/tmp/.build

            echo "toolchain skipped!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          if [ -d "./feeds/luci" ] && [ -d "./feeds/packages" ] && [ "${{ steps.check-cache.outputs.cache-hit }}" = "true" ]; then
            echo "Feeds restored from cache, skip update"
            ./scripts/feeds install -a
          else
            ./scripts/feeds update -a
            ./scripts/feeds install -a
          fi

      - name: Custom Packages
        run: |
          cd ./wrt/package/

          $GITHUB_WORKSPACE/Scripts/Packages.sh
          $GITHUB_WORKSPACE/Scripts/Handles.sh

      - name: Custom Settings
        run: |
          cd ./wrt/

          cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          if ! make defconfig -j$(nproc); then
            echo "ERROR: make defconfig failed!"
            cat .config
            exit 1
          fi

          make clean -j$(nproc)

      - name: Check Disk Space
        run: |
          echo "=== DISK SPACE BEFORE BUILD ==="
          df -h
          echo "=== TOP 10 LARGE DIRS ==="
          du -sh ./wrt/* 2>/dev/null | sort -rh | head -10

      - name: Download Packages
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Compile Firmware
        timeout-minutes: 300
        run: |
          cd ./wrt/

          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "=== BUILD FAILED — LAST 50 ERRORS ==="
            echo "========================================"
            grep -iE 'error|conflict|failed|No such|No rule|cannot|denied' build.log | tail -50
            exit 1
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: build-log-${{env.WRT_CONFIG}}
          path: ./wrt/build.log
          retention-days: 3

      - name: Machine Information
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          cp -f ./.config ./upload/Config-"$WRT_CONFIG"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_DATE".txt

          echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
          echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

          find ./bin/targets/ -iregex ".*\(buildinfo\|json\|sha256sums\|packages\)$" -exec rm -rf {} +

          for FILE in $(find ./bin/targets/ -type f -iname "*$WRT_TARGET*") ; do
            EXT=$(basename $FILE | cut -d '.' -f 2-)
            NAME=$(basename $FILE | cut -d '.' -f 1 | grep -io "\($WRT_TARGET\).*")
            NEW_FILE="$NAME"-"$WRT_INFO"-"$WRT_BRANCH"-"$WRT_WIFI"-"$WRT_DATE"."$EXT"
            mv -f $FILE ./upload/$NEW_FILE
          done

          find ./bin/targets/ -type f -exec mv -f {} ./upload/ \;

      - name: Release Firmware
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_BRANCH}}-${{env.WRT_DATE}}
          files: ./wrt/upload/*.*
          body: |
            NRadio C8-660 (MT7981) 专用 ImmortalWrt 固件

            源码：${{env.WRT_REPO}}
            分支：${{env.WRT_BRANCH}}
            提交：${{env.WRT_HASH}}

            平台：${{env.WRT_TARGET}} / 配置：${{env.WRT_CONFIG}}

            登录地址：${{env.WRT_IP}}
            登录密码：${{env.WRT_PW}}

            WIFI名称：${{env.WRT_SSID}}
            WIFI密码：${{env.WRT_WORD}}

            内核版本：${{env.WRT_KVER}}
            插件列表：${{env.WRT_LIST}}

      - name: Clean Build Workspace
        if: always()
        run: |
          cd ./wrt/
          make clean -j$(nproc)

# ImmortalWrt 固件编译 — NRadio C8-660 (MT7981)
name: ImmortalWrt NRadio C8-660

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: NRADIO-C8-660
  WRT_THEME: aurora
  WRT_NAME: NRadio-C8-660
  WRT_SSID: NRadio-WiFi
  WRT_WORD: ${{ secrets.WRT_WORD || '' }}
  WRT_IP: 192.168.1.1
  WRT_PW: ${{ secrets.WRT_PW || '' }}
  WRT_REPO: https://github.com/immortalwrt/immortalwrt
  WRT_BRANCH: master

jobs:
  build:
    name: immortalwrt-c8-660
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Projects
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox 2>/dev/null || true
          sudo -E apt -yqq update && sudo -E apt -yqq full-upgrade && sudo -E apt -yqq install -y dos2unix libfuse-dev git curl wget file jq unzip && sudo -E apt -yqq autoremove --purge && sudo -E apt -yqq autoclean
          curl -fsSL --retry 3 "https://build-scripts.immortalwrt.org/init_build_environment.sh" -o /tmp/init_build_env.sh
          echo "init_build_env.sh SHA256: $(sha256sum /tmp/init_build_env.sh | cut -d' ' -f1)"
          if [ -n "${INIT_BUILD_EXPECTED_SHA256:-}" ]; then
            echo "$INIT_BUILD_EXPECTED_SHA256 /tmp/init_build_env.sh" | sha256sum -c --status || {
              echo "::error::init_build_env.sh SHA256 MISMATCH — refusing to run"
              exit 1
            }
            echo "init_build_env.sh SHA256 verified ✓"
          else
            echo "::warning::INIT_BUILD_EXPECTED_SHA256 not set — running unverified script"
          fi
          sudo bash /tmp/init_build_env.sh
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "CCACHE_DIR=$(pwd)/wrt/.ccache" >> $GITHUB_ENV
          echo "WRT_DATE=$(TZ=UTC-8 date +"%y.%m.%d-%H.%M.%S")-${RANDOM}" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=immortalwrt" >> $GITHUB_ENV
          echo "WRT_TARGET=nradio_wt9103" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch $WRT_BRANCH $WRT_REPO ./wrt/

          cd ./wrt/ && echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

      - name: Apply Patches
        run: |
          bash $GITHUB_WORKSPACE/Scripts/Patches.sh ./wrt/

      - name: Verify DTS
        run: |
          OK=true
          for DTS in ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts; do
            if [ -f "$DTS" ]; then echo "OK: Found $DTS";
            else echo "ERR: Missing $DTS"; OK=false; fi
          done
          if grep -q "nradio_wt9103" ./wrt/target/linux/mediatek/image/filogic.mk; then
            echo "OK: Device added to filogic.mk"
          else
            echo "ERR: Device NOT in filogic.mk"
            tail -5 ./wrt/target/linux/mediatek/image/filogic.mk
            OK=false
          fi
          if ! $OK; then exit 1; fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iname "*.sh" -exec dos2unix {} \; -exec chmod +x {} \;
          find ./ -maxdepth 3 -type f -iname "*.txt" -exec dos2unix {} \;
          find ./ -maxdepth 3 -type f -iname "*.mk" -exec dos2unix {} \;

      - name: Check Caches
        id: check-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/feeds
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*
            ./wrt/dl

      - name: Update Caches
        run: |
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          if [ -d "./wrt/staging_dir" ]; then
            cd ./wrt/
            rm -rf build_dir staging_dir/target* tmp 2>/dev/null || true
            mkdir -p tmp && echo "1" > tmp/.build
            find "staging_dir" -type d -name "stamp" -not -path "*target*" 2>/dev/null | while read -r DIR; do
              find "$DIR" -type f -exec touch {} + 2>/dev/null || true
            done
            echo "toolchain clean done!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" --limit 100 | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Debug Custom Packages
        if: failure()
        run: |
          echo "=== PWD ===" && pwd
          echo "=== WRT Root ===" && ls -la ./wrt/ | head -20
          echo "=== Package Dir ===" && ls -la ./wrt/package/ 2>&1 | head -20
          echo "=== Feeds ===" && ls ./wrt/feeds/ 2>&1
          echo "=== Scripts ===" && ls -la "$GITHUB_WORKSPACE/Scripts/"
          [ -f "$GITHUB_WORKSPACE/Scripts/Packages.sh" ] && echo "OK: Packages.sh EXISTS" || echo "ERR: Packages.sh MISSING"
          [ -x "$GITHUB_WORKSPACE/Scripts/Packages.sh" ] && echo "OK: Packages.sh EXECUTABLE" || echo "ERR: Packages.sh NOT EXECUTABLE"
          echo "=== Git ===" && git --version
          echo "=== jq ===" && jq --version 2>&1
          echo "=== Network ===" && curl -fsSL -o /dev/null -w "github.com:%{http_code}\n" https://github.com/eamonxg/luci-theme-aurora 2>&1

      - name: Custom Packages
        run: |
          trap 'echo "::error::Failed at line $LINENO with exit $?" >&2' ERR

          cd ./wrt/package/ || { echo "::error::cd ./wrt/package/ failed" >&2; exit 1; }

          {
            $GITHUB_WORKSPACE/Scripts/Packages.sh
            $GITHUB_WORKSPACE/Scripts/Handles.sh
          } 2>&1 | tee /tmp/packages.log

      - name: Debug DUMP Output
        run: |
          cd ./wrt/
          echo "=== DUMP output for nradio (image dir) ==="
          make -C target/linux/mediatek/image DUMP=1 SUBTARGET=filogic 2>&1 | grep -i nradio || echo "WARN: nradio NOT in DUMP output"
          echo ""
          echo "=== DUMP output for nradio (target dir) ==="
          make -C target/linux/mediatek DUMP=1 SUBTARGET=filogic 2>&1 | grep -i nradio || echo "WARN: nradio NOT in DUMP output (target)"
          echo ""
          echo "=== Last 30 lines of filogic.mk ==="
          tail -30 target/linux/mediatek/image/filogic.mk
          echo ""
          echo "=== filogic.mk file info ==="
          file target/linux/mediatek/image/filogic.mk
          wc -l target/linux/mediatek/image/filogic.mk

      - name: Custom Settings
        run: |
          cd ./wrt/
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"

          cat $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          echo "=== .config before defconfig ==="
          grep '^CONFIG_TARGET' .config || echo "No CONFIG_TARGET lines in .config"

          if ! make defconfig -j$(nproc); then
            echo "ERROR: make defconfig failed!"
            cat .config
            exit 1
          fi

          echo "=== .config after defconfig ==="
          grep '^CONFIG_TARGET' .config || echo "No CONFIG_TARGET lines after defconfig"

          echo ""
          echo "=== tmp/.targetinfo nradio lines ==="
          grep -i nradio tmp/.targetinfo 2>/dev/null || echo "nradio NOT in .targetinfo"

          echo ""
          echo "=== tmp/.config-target.in nradio lines ==="
          grep -i nradio tmp/.config-target.in 2>/dev/null || echo "nradio NOT in .config-target.in"

          echo ""
          echo "=== defconfig target entries ==="
          grep -E '^CONFIG_TARGET' .config

          SELECTED_DEVICE=$(grep -oP '^CONFIG_TARGET_DEVICE_[\w]+_DEVICE_\K[\w-]+(?=\=y)' .config | head -1)
          echo "Selected device: '$SELECTED_DEVICE'"
          if [ "$SELECTED_DEVICE" != "nradio_wt9103" ]; then
            echo "::error::WRONG DEVICE: expected nradio_wt9103, got '$SELECTED_DEVICE'"
            exit 1
          fi
          echo "OK: Device nradio_wt9103 selected correctly"

      - name: Download Packages
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Check Disk Space
        run: |
          echo "=== DISK SPACE AFTER DOWNLOAD ==="
          df -h
          echo "=== TOP 10 LARGE DIRS ==="
          du -sh ./wrt/* 2>/dev/null | sort -rh | head -10

      - name: Compile Firmware
        timeout-minutes: ${{ steps.check-cache.outputs.cache-hit == 'true' && 120 || 300 }}
        run: |
          cd ./wrt/
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"

          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "=== BUILD FAILED — LAST 50 ERRORS ==="
            echo "========================================"
            grep -iE 'error|conflict|failed|No such|No rule|cannot|denied' build.log | tail -50
            exit 1
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-log-${{env.WRT_CONFIG}}
          path: ./wrt/build.log
          retention-days: 3
          if-no-files-found: warn

      - name: Upload Packages Debug
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: packages-debug-${{env.WRT_CONFIG}}
          path: /tmp/packages.log
          retention-days: 3
          if-no-files-found: warn

      - name: Upload Config Snapshot
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: config-snapshot-${{env.WRT_CONFIG}}
          path: |
            ./wrt/.config
            ./wrt/tmp/.targetinfo
            ./wrt/tmp/.config-target.in
          retention-days: 3
          if-no-files-found: warn

      - name: Machine Information
        if: failure()
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir ./upload/

          echo "WRT_KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \;)" >> $GITHUB_ENV
          echo "WRT_LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')" >> $GITHUB_ENV

          find ./bin/targets/ -iregex ".*\(buildinfo\|json\|packages\)$" -exec rm -rf {} +

          # 保留关键镜像，统一命名
          for FILE in $(find ./bin/targets/ -type f -iname "*factory*" -o -iname "*sysupgrade*" -o -iname "*initramfs*" -o -iname "*bl2*" -o -iname "*manifest*" -o -iname "*sha256sums*" -o -iname "*.dtb" 2>/dev/null); do
            BASENAME=$(basename "$FILE")
            cp -f "$FILE" "./upload/$BASENAME"
          done

          # 只保留 C8-660 所需的 BL2
          find ./upload/ -type f -iname "*bl2*" ! -iname "mt7981*" -delete

          # 固件重命名
          for FILE in ./upload/*.bin; do
            [ -f "$FILE" ] || continue
            BASE=$(basename "$FILE")
            case "$BASE" in
              *squashfs-factory*)  SHORT="immortalwrt-c8-660-factory.bin" ;;
              *squashfs-sysupgrade*) SHORT="immortalwrt-c8-660-sysupgrade.bin" ;;
              *initramfs*)        SHORT="immortalwrt-c8-660-initramfs.bin" ;;
              *bl2*)              SHORT="mt7981-bl2.bin" ;;
              *)                  continue ;;
            esac
            mv -f "$FILE" "./upload/$SHORT"
          done

      - name: Cleanup Old Releases
        run: |
          KEEP=3
          RELEASES=$(gh release list --json tagName,publishedAt --limit 100 -q 'sort_by(.[]; .publishedAt) | .[0:-'"$KEEP"'] | .[].tagName' 2>/dev/null) || true
          for TAG in $RELEASES; do
            echo "Deleting release and tag: $TAG"
            gh release delete "$TAG" --yes 2>/dev/null || true
            git push --delete origin "$TAG" 2>/dev/null || true
          done
          echo "Cleanup done (kept last $KEEP releases)"

      - name: Prepare Release Info
        run: |
          if [ -z "$WRT_PW" ]; then
            echo "WRT_PW_DISPLAY=（无）" >> $GITHUB_ENV
          else
            echo "WRT_PW_DISPLAY=$WRT_PW" >> $GITHUB_ENV
          fi
          if [ -z "$WRT_WORD" ]; then
            echo "WRT_WORD_DISPLAY=（无密码，开放）" >> $GITHUB_ENV
          else
            echo "WRT_WORD_DISPLAY=$WRT_WORD" >> $GITHUB_ENV
          fi

      - name: Release Firmware
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: immortalwrt-c8-660-${{env.WRT_DATE}}
          files: |
            ./wrt/upload/immortalwrt-c8-660-factory.bin
            ./wrt/upload/immortalwrt-c8-660-sysupgrade.bin
            ./wrt/upload/immortalwrt-c8-660-initramfs.bin
            ./wrt/upload/mt7981-bl2.bin
            ./wrt/upload/*.manifest
            ./wrt/upload/sha256sums
          body: |
            ## NRadio C8-660 (MT7981) ImmortalWrt 固件

            ### 刷机说明

            **首次刷机（从原厂 NROS 刷入）：**
            1. 按住 Reset 按键上电，进入 U-Boot TFTP 恢复模式
            2. 电脑设置静态 IP 192.168.1.x（如 192.168.1.2）
            3. 使用 TFTP 客户端上传 `immortalwrt-c8-660-factory.bin`
            4. 等待 3-5 分钟，访问 http://192.168.1.1

            **升级（同版本 OpenWrt）：**
            - LuCI → 系统 → 备份/升级 → 刷写固件 → 选择 `immortalwrt-c8-660-sysupgrade.bin`

            ### 固件信息

            | 项目 | 值 |
            |------|-----|
            | 源码 | ${{env.WRT_REPO}} (${{env.WRT_BRANCH}}) |
            | 提交 | ${{env.WRT_HASH}} |
            | 内核 | ${{env.WRT_KVER}} |
            | 登录地址 | ${{env.WRT_IP}} |
            | 登录密码 | ${{env.WRT_PW_DISPLAY}} |
            | WiFi | ${{env.WRT_SSID}} / ${{env.WRT_WORD_DISPLAY}} |
            | 插件 | ${{env.WRT_LIST}} |

            **注意：** 登录 IP 已从原厂 192.168.66.1 变更为 192.168.1.1。5G 模组（RM520N-CN）首次启动约需 60 秒完成初始化。

            > ⚠️ 本项目编译产物使用 mainline 内核（6.x），与 NRadio SDK 内核（5.4）引导链不兼容。刷机前请务必通过 U-Boot TFTP 模式备份 BL2 和 FIP 分区。刷机风险自担。

      - name: Clean Build Workspace
        if: always()
        run: |
          cd ./wrt/
          make clean -j$(nproc)

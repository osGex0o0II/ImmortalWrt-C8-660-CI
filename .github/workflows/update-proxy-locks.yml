name: Update Proxy Locks

on:
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    name: update-proxy-locks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Refresh proxy locks
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/Scripts/RefreshProxyLocks.sh"

      - name: Commit changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if git diff --quiet -- .github/proxy-locks.env; then
            echo "No proxy lock changes"
            exit 0
          fi

          BRANCH="codex/update-proxy-locks"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add .github/proxy-locks.env
          git commit -m "ci: update proxy locks"
          git push --force-with-lease origin "$BRANCH"

          if gh pr view "$BRANCH" --json url --jq .url >/tmp/proxy-locks-pr-url 2>/dev/null; then
            echo "Updated existing proxy lock PR: $(cat /tmp/proxy-locks-pr-url)"
          else
            gh pr create \
              --base "${{ github.ref_name }}" \
              --head "$BRANCH" \
              --title "ci: update proxy locks" \
              --body "Updates HomeProxy/sing-box lock versions for manual review before they become the default build baseline."
          fi

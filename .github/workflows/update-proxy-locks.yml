name: Update Proxy Locks

on:
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * *"

permissions:
  contents: write

jobs:
  update:
    name: update-proxy-locks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Projects
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Refresh proxy locks
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/Scripts/RefreshProxyLocks.sh"

      - name: Commit changes
        run: |
          set -euo pipefail

          if git diff --quiet -- .github/proxy-locks.env; then
            echo "No proxy lock changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/proxy-locks.env
          git commit -m "ci: update proxy locks"
          git push origin HEAD:${{ github.ref_name }}

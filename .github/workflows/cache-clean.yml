# Weekly full cache purge for the C8-660 build workflows.
name: Cache Clean

on:
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cache-clean:
    name: Clear All Build Caches
    runs-on: ubuntu-latest
    steps:
      - name: Delete All Caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COUNT="$(gh cache list --limit 100 --json id --jq 'length' 2>/dev/null || echo 0)"
          echo "Caches before clean: $COUNT"
          if ! gh cache delete --all --yes; then
            echo "::warning::gh cache delete --all failed; falling back to per-cache delete"
            while read -r CACHE_ID; do
              [ -n "$CACHE_ID" ] || continue
              gh cache delete "$CACHE_ID" 2>/dev/null || true
            done < <(gh cache list --limit 100 --json id --jq '.[].id' 2>/dev/null || true)
          fi
          echo "Cache clean done"

          fi
          if config_enabled 'kmod-mtd-rw'; then
            require_rootfs 'lib/modules/.*/mtd-rw\.ko' 'MTD rw kernel module'
          else
            reject_rootfs 'lib/modules/.*/mtd-rw\.ko' 'MTD rw kernel module'
          fi
          if config_enabled 'openssh-sftp-server'; then
            require_rootfs 'usr/libexec/sftp-server|usr/lib/sftp-server' 'OpenSSH SFTP server'
          else
            reject_rootfs 'usr/libexec/sftp-server|usr/lib/sftp-server' 'OpenSSH SFTP server'
          fi
          if config_enabled 'socat'; then
            require_rootfs 'usr/bin/socat' 'socat multipurpose relay'
          else
            reject_rootfs 'usr/bin/socat' 'socat multipurpose relay'
          fi
          if config_enabled 'sing-box'; then
            require_rootfs 'usr/bin/sing-box' 'sing-box proxy core'
            LOCKED_SING_BOX_VERSION=""
            if [ -f "$GITHUB_WORKSPACE/.github/proxy-locks.env" ]; then
              LOCKED_SING_BOX_VERSION="$(sed -n 's/^SING_BOX_VERSION=//p' "$GITHUB_WORKSPACE/.github/proxy-locks.env" | head -1 | tr -d '\r')"
            fi
            SING_BOX_MANIFEST_VERSION="$(awk '$1 == "sing-box" && $2 == "-" { print $3; exit }' "$MANIFEST_FILE")"
            if [ -z "$SING_BOX_MANIFEST_VERSION" ]; then
              echo "::error::sing-box manifest version was not found"
              exit 1
            fi
            if [ -n "$LOCKED_SING_BOX_VERSION" ]; then
              case "$SING_BOX_MANIFEST_VERSION" in
                "$LOCKED_SING_BOX_VERSION"|"$LOCKED_SING_BOX_VERSION"-*) ;;
                *)
                  echo "::error::sing-box manifest version ${SING_BOX_MANIFEST_VERSION} does not match lock ${LOCKED_SING_BOX_VERSION}"
                  exit 1
                  ;;
              esac
            fi
            DETECTED_SING_BOX_VERSION="${SING_BOX_MANIFEST_VERSION%%-*}"
            echo "OK: sing-box manifest version ${SING_BOX_MANIFEST_VERSION}"
          else
            reject_rootfs 'usr/bin/sing-box' 'sing-box proxy core'
          fi
          if config_enabled 'luci-app-homeproxy'; then
            require_rootfs 'etc/init\.d/homeproxy' 'HomeProxy init service'
            require_rootfs 'etc/config/homeproxy' 'HomeProxy UCI config'
            require_rootfs 'usr/share/luci/menu\.d/luci-app-homeproxy\.json' 'LuCI HomeProxy app'
            require_rootfs 'usr/share/rpcd/acl\.d/luci-app-homeproxy\.json' 'LuCI HomeProxy ACL'
            require_rootfs 'www/luci-static/resources/homeproxy\.js' 'HomeProxy shared LuCI helper'
            require_rootfs 'www/luci-static/resources/view/homeproxy/client\.js' 'HomeProxy client page'
            require_rootfs 'www/luci-static/resources/view/homeproxy/node\.js' 'HomeProxy node page'
            require_rootfs 'www/luci-static/resources/view/homeproxy/server\.js' 'HomeProxy server page'
            require_rootfs 'www/luci-static/resources/view/homeproxy/status\.js' 'HomeProxy status page'
            require_rootfs 'etc/homeproxy/scripts/generate_client\.uc' 'HomeProxy client config generator'
            require_rootfs 'etc/homeproxy/scripts/update_subscriptions\.uc' 'HomeProxy subscription updater'
            require_rootfs 'etc/uci-defaults/99-homeproxy-modern-defaults' 'HomeProxy modern subscription defaults'
            require_rootfs 'usr/lib/ucode/digest\.so' 'ucode digest module for HomeProxy'
            HOMEPROXY_NODE_JS="$("$UNSQUASHFS" -cat "$ROOTFS" www/luci-static/resources/view/homeproxy/node.js)"
            HOMEPROXY_SHARED_JS="$("$UNSQUASHFS" -cat "$ROOTFS" www/luci-static/resources/homeproxy.js)"
            if printf '%s' "$HOMEPROXY_NODE_JS" | grep -Eq "o.value\('vmess'|o.value\('shadowtls'|o.value\('ssh'|o.value\('socks'|o.value\('hysteria',"; then
              echo "::error::HomeProxy node UI still exposes legacy protocol choices"
              printf '%s\n' "$HOMEPROXY_NODE_JS" | grep -nE "o.value\('vmess'|o.value\('shadowtls'|o.value\('ssh'|o.value\('socks'|o.value\('hysteria'," || true
              exit 1
            fi
            if printf '%s\n%s' "$HOMEPROXY_NODE_JS" "$HOMEPROXY_SHARED_JS" | grep -Eq "aes-128-ctr|aes-192-ctr|aes-256-ctr|aes-128-cfb|aes-192-cfb|aes-256-cfb|chacha20'|chacha20-ietf'|rc4-md5"; then
              echo "::error::HomeProxy LuCI still exposes legacy Shadowsocks methods"
              printf '%s\n%s' "$HOMEPROXY_NODE_JS" "$HOMEPROXY_SHARED_JS" | grep -nE "aes-128-ctr|aes-192-ctr|aes-256-ctr|aes-128-cfb|aes-192-cfb|aes-256-cfb|chacha20'|chacha20-ietf'|rc4-md5" || true
              exit 1
            fi
            if ! printf '%s' "$HOMEPROXY_NODE_JS" | grep -Fq "hp.shadowsocks_encrypt_methods"; then
              echo "::error::HomeProxy node page does not use shared Shadowsocks method list"
              exit 1
            fi
            HOMEPROXY_MENU_JSON="$("$UNSQUASHFS" -cat "$ROOTFS" usr/share/luci/menu.d/luci-app-homeproxy.json)"
            if printf '%s' "$HOMEPROXY_MENU_JSON" | grep -Fq "admin/services/homeproxy/server"; then
              echo "::error::HomeProxy server menu entry is still exposed"
              exit 1
            fi
          HOMEPROXY_SERVER_JS="$("$UNSQUASHFS" -cat "$ROOTFS" www/luci-static/resources/view/homeproxy/server.js)"
          if ! printf '%s' "$HOMEPROXY_SERVER_JS" | grep -Fq "o.readonly = true;" || ! printf '%s' "$HOMEPROXY_SERVER_JS" | grep -Fq "o.default = o.disabled;"; then
            echo "::error::HomeProxy server page is not forced disabled/read-only"
            printf 'server.js bytes: '; printf '%s' "$HOMEPROXY_SERVER_JS" | wc -c
            printf 'server.js sha256: '; printf '%s' "$HOMEPROXY_SERVER_JS" | (sha256sum 2>/dev/null || shasum -a 256) | cut -d' ' -f1
            printf '%s' "$HOMEPROXY_SERVER_JS" | grep -nE "Flag, 'enabled'|readonly|o\.default = o\.(enabled|disabled)" | head -20 || true
            "$UNSQUASHFS" -ll "$ROOTFS" | grep -E 'homeproxy/(server|node)\.js' || true
            exit 1
          fi
            HOMEPROXY_GENERATOR="$("$UNSQUASHFS" -cat "$ROOTFS" etc/homeproxy/scripts/generate_client.uc)"
            if ! printf '%s' "$HOMEPROXY_GENERATOR" | grep -q 'modern_node_types'; then
              echo "::error::HomeProxy generator is missing modern-node guard"
              exit 1
            fi
            if ! printf '%s' "$HOMEPROXY_GENERATOR" | grep -Fq "inbound: ['mixed-in', 'redirect-in', 'tproxy-in', 'tun-in']"; then
              echo "::error::HomeProxy generator is missing sing-box route sniff action"
              exit 1
            fi
            if printf '%s' "$HOMEPROXY_GENERATOR" | grep -Fq "sniff_override_destination: strToBool(sniff_override)" || printf '%s' "$HOMEPROXY_GENERATOR" | grep -Fq "sniff: true"; then
              echo "::error::HomeProxy generator still contains legacy sing-box inbound sniff fields"
              exit 1
            fi
            if ! printf '%s' "$HOMEPROXY_GENERATOR" | grep -Fq "const main_urltest_nodes = filter(uci.get(uciconfig, ucimain, 'main_urltest_nodes')"; then
              echo "::error::HomeProxy generator does not filter stale main urltest nodes"
              exit 1
            fi
            if ! printf '%s' "$HOMEPROXY_GENERATOR" | grep -Fq "const main_udp_urltest_nodes = filter(uci.get(uciconfig, ucimain, 'main_udp_urltest_nodes')"; then
              echo "::error::HomeProxy generator does not filter stale UDP urltest nodes"
              exit 1
            fi
            if ! printf '%s' "$HOMEPROXY_GENERATOR" | grep -Fq "const cfg_urltest_nodes = filter(cfg.urltest_nodes || []"; then
              echo "::error::HomeProxy generator does not filter stale custom urltest nodes"
              exit 1
            fi
            if ! printf '%s' "$HOMEPROXY_GENERATOR" | grep -Fq "!is_modern_node(urltest_node)"; then
              echo "::error::HomeProxy generator does not filter standalone stale/legacy urltest outbound nodes"
              exit 1
            fi
            DETECTED_SING_BOX_VERSION="${DETECTED_SING_BOX_VERSION:-0.0.0}"
            version_ge() {
              awk -v have="$1" -v need="$2" '
                function splitver(v, a) { split(v, a, /[.+_-]/) }
                BEGIN {
                  splitver(have, h); splitver(need, n)
                  for (i = 1; i <= 4; i++) {
                    hv = (h[i] == "" ? 0 : h[i] + 0)
                    nv = (n[i] == "" ? 0 : n[i] + 0)
                    if (hv > nv) exit 0
                    if (hv < nv) exit 1
                  }
                  exit 0
                }'
            }
            if version_ge "$DETECTED_SING_BOX_VERSION" "1.14.0"; then
              if ! printf '%s' "$HOMEPROXY_GENERATOR" | grep -Fq "default_http_client: 'direct-http'"; then
                echo "::error::HomeProxy generator is missing sing-box 1.14 direct HTTP client default"
                exit 1
              fi
              if ! printf '%s' "$HOMEPROXY_GENERATOR" | grep -Fq "tag: 'direct-http'"; then
                echo "::error::HomeProxy generator is missing sing-box 1.14 direct HTTP client definition"
                exit 1
              fi
              HTTP_CLIENT_DEFS="$(printf '%s' "$HOMEPROXY_GENERATOR" | awk 'index($0, "config.http_clients = [") || index($0, "http_clients: [") { count++ } END { print count + 0 }')"
              if [ "$HTTP_CLIENT_DEFS" -ne 1 ]; then
                echo "::error::Unexpected HomeProxy HTTP client definition count for sing-box ${DETECTED_SING_BOX_VERSION}: ${HTTP_CLIENT_DEFS}"
                exit 1
              fi
              HTTP_CLIENT_USES="$(printf '%s' "$HOMEPROXY_GENERATOR" | awk 'index($0, "http_client: '\''direct-http'\''") { count++ } END { print count + 0 }')"
              if [ "$HTTP_CLIENT_USES" -lt 3 ]; then
                echo "::error::HomeProxy generator does not use direct HTTP client for remote rule-set bootstrap"
                exit 1
              fi
              if printf '%s' "$HOMEPROXY_GENERATOR" | grep -Fq "download_detour:"; then
                echo "::error::HomeProxy generator still uses deprecated download_detour for sing-box ${DETECTED_SING_BOX_VERSION}"
                exit 1
              fi
            else
              if ! printf '%s' "$HOMEPROXY_GENERATOR" | grep -Fq "download_detour: 'direct-out'"; then
                echo "::error::HomeProxy generator does not force rule-set bootstrap downloads to direct-out"
                exit 1
              fi
              DIRECT_DETOURS="$(printf '%s' "$HOMEPROXY_GENERATOR" | awk 'index($0, "download_detour: '\''direct-out'\''") { count++ } END { print count + 0 }')"
              if [ "$DIRECT_DETOURS" -lt 3 ]; then
                echo "::error::HomeProxy generator does not consistently force rule-set bootstrap downloads to direct-out"
                exit 1
              fi
              if printf '%s' "$HOMEPROXY_GENERATOR" | grep -Fq "download_detour: 'main-out'"; then
                echo "::error::HomeProxy generator still bootstraps rule-set downloads through main-out"
                exit 1
              fi
            fi
            HOMEPROXY_UPDATER="$("$UNSQUASHFS" -cat "$ROOTFS" etc/homeproxy/scripts/update_subscriptions.uc)"
            if ! printf '%s' "$HOMEPROXY_UPDATER" | grep -Fq "function modern_check"; then
              echo "::error::HomeProxy updater is missing modern subscription node filter"
              exit 1
            fi
            if ! printf '%s' "$HOMEPROXY_UPDATER" | grep -Fq "config = modern_check(config);"; then
              echo "::error::HomeProxy updater does not apply modern subscription node filter"
              exit 1
            fi
            if ! printf '%s' "$HOMEPROXY_UPDATER" | grep -Fq "case 'vmess':"; then
              echo "::error::HomeProxy updater is missing VMess rejection path"
              exit 1
            fi
            if printf '%s' "$HOMEPROXY_UPDATER" | grep -Eq "aes-128-ctr|aes-192-ctr|aes-256-ctr|aes-128-cfb|aes-192-cfb|aes-256-cfb|chacha20'|chacha20-ietf'|rc4-md5"; then
              echo "::error::HomeProxy updater still allows legacy Shadowsocks methods"
              exit 1
            fi
            if ! printf '%s' "$HOMEPROXY_UPDATER" | grep -Fq "function is_placeholder_subscription_node"; then
              echo "::error::HomeProxy updater is missing placeholder subscription node filter"
              exit 1
            fi
            if ! printf '%s' "$HOMEPROXY_UPDATER" | grep -Fq "Skipping placeholder subscription node"; then
              echo "::error::HomeProxy updater does not log skipped placeholder subscription nodes"
              exit 1
            fi
            if ! printf '%s' "$HOMEPROXY_UPDATER" | grep -Fq "No main node is selected, switching to the first node"; then
              echo "::error::HomeProxy updater is missing first subscription node fallback"
              exit 1
            fi
            HOMEPROXY_DEFAULTS="$("$UNSQUASHFS" -cat "$ROOTFS" etc/uci-defaults/99-homeproxy-modern-defaults)"
            if ! printf '%s' "$HOMEPROXY_DEFAULTS" | grep -Fq "homeproxy.subscription.user_agent='v2ray'" || ! printf '%s' "$HOMEPROXY_DEFAULTS" | grep -Fq "homeproxy.subscription.allow_insecure='0'"; then
              echo "::error::HomeProxy subscription defaults are missing v2ray user-agent or allow_insecure=0"
              exit 1
            fi
            echo "OK: HomeProxy modern client mode is enforced"
          else
            reject_rootfs 'etc/init\.d/homeproxy' 'HomeProxy init service'
            reject_rootfs 'usr/share/luci/menu\.d/luci-app-homeproxy\.json' 'LuCI HomeProxy app'
            reject_rootfs 'usr/share/rpcd/acl\.d/luci-app-homeproxy\.json' 'LuCI HomeProxy ACL'
            reject_rootfs 'www/luci-static/resources/view/homeproxy/' 'LuCI HomeProxy views'
            reject_rootfs 'etc/uci-defaults/99-homeproxy-modern-defaults' 'HomeProxy modern subscription defaults'
          fi
          if config_enabled 'kmod-nft-tproxy'; then
            require_rootfs 'lib/modules/.*/nft_tproxy\.ko' 'NFT tproxy kernel module'
          else
            reject_rootfs 'lib/modules/.*/nft_tproxy\.ko' 'NFT tproxy kernel module'
          fi
          if config_enabled 'kmod-nft-socket'; then
            require_rootfs 'lib/modules/.*/nft_socket\.ko' 'NFT socket kernel module'
          else
            reject_rootfs 'lib/modules/.*/nft_socket\.ko' 'NFT socket kernel module'
          fi
          if config_enabled 'kmod-nf-tproxy'; then
            require_rootfs 'lib/modules/.*/nf_tproxy_ipv[46]\.ko' 'NF tproxy dependency kernel module'
          else
            reject_rootfs 'lib/modules/.*/nf_tproxy_ipv[46]\.ko' 'NF tproxy dependency kernel module'
          fi
          if config_enabled 'kmod-nf-socket'; then
            require_rootfs 'lib/modules/.*/nf_socket_ipv[46]\.ko' 'NF socket dependency kernel module'
          else
            reject_rootfs 'lib/modules/.*/nf_socket_ipv[46]\.ko' 'NF socket dependency kernel module'
          fi
          require_rootfs 'usr/bin/cellscan\.sh' 'C8 base station scan helper'
          require_rootfs 'usr/share/luci/menu\.d/luci-app-c8modem\.json' 'C8 modem LuCI JS menu'
          require_rootfs 'usr/share/rpcd/acl\.d/luci-app-c8modem\.json' 'C8 modem LuCI ACL'
          require_rootfs 'www/luci-static/resources/view/c8modem/signal\.js' 'C8 modem JS signal page'
          require_rootfs 'www/luci-static/resources/view/c8modem/status\.js' 'C8 modem JS status page'
          require_rootfs 'www/luci-static/resources/view/c8modem/settings\.js' 'C8 modem JS settings page'
          require_rootfs 'www/luci-static/resources/view/c8modem/at\.js' 'C8 modem JS AT page'
          require_rootfs 'www/luci-static/resources/view/c8modem/cellscan\.js' 'C8 base station scan JS page'
          require_rootfs 'www/luci-static/resources/view/c8modem/sms-read\.js' 'C8 SMS JS read page'
          require_rootfs 'www/luci-static/resources/view/c8modem/sms-send\.js' 'C8 SMS JS send page'
          require_rootfs 'www/luci-static/resources/view/c8modem/sms-forward\.js' 'C8 SMS JS forwarding page'
          require_rootfs 'www/luci-static/resources/view/c8modem/sms-settings\.js' 'C8 SMS JS settings page'
          require_rootfs 'www/luci-static/resources/view/status(.*/)?10_system\.js' 'LuCI system status JS'

          C8_MENU_JSON="$("$UNSQUASHFS" -cat "$ROOTFS" usr/share/luci/menu.d/luci-app-c8modem.json)"
          if ! printf '%s' "$C8_MENU_JSON" | grep -q '"path"[[:space:]]*:[[:space:]]*"c8modem/status"'; then
            echo "::error::C8 modem status menu does not target c8modem/status"
            exit 1
          fi
          C8_ACL_JSON="$("$UNSQUASHFS" -cat "$ROOTFS" usr/share/rpcd/acl.d/luci-app-c8modem.json)"
          for REQUIRED_ACL in \
            '"/usr/bin/cellscan.sh status"' \
            '"/usr/bin/cellscan.sh start"' \
            '"/usr/bin/cellscan.sh stop"' \
            '"/usr/share/modem/luci-reinit.sh"'
          do
            if ! printf '%s' "$C8_ACL_JSON" | grep -q "$REQUIRED_ACL"; then
              echo "::error::C8 modem ACL missing: $REQUIRED_ACL"
              exit 1
            fi
          done
          for REJECTED_ACL in \
            '"/bin/sendat 2 \*"' \
            '"/usr/bin/cellscan.sh \*"' \
            '"/usr/bin/iwinfo \*"' \
            '"/usr/share/modem/rm520n.sh"'
          do
            if printf '%s' "$C8_ACL_JSON" | grep -q "$REJECTED_ACL"; then
              echo "::error::C8 modem ACL still has broad or unused permission: $REJECTED_ACL"
              exit 1
            fi
          done
          SMS_TOOL_CONFIG="$("$UNSQUASHFS" -cat "$ROOTFS" etc/config/sms_tool)"
          if ! printf '%s' "$SMS_TOOL_CONFIG" | grep -q 'sms_tool_timeout'; then
            echo "::error::sms_tool config is missing sms_tool_timeout"
            exit 1
          fi
          SMS_FORWARD_SCRIPT="$("$UNSQUASHFS" -cat "$ROOTFS" usr/bin/c8-sms-forward)"
          if ! printf '%s' "$SMS_FORWARD_SCRIPT" | grep -q 'run_sms_tool'; then
            echo "::error::C8 SMS forwarding backend is missing sms_tool timeout guard"
            exit 1
          fi
          if printf '%s' "$SMS_FORWARD_SCRIPT" | grep -q 'wechatpush\.config'; then
            echo "::error::C8 SMS forwarding backend still reads standalone WeChatPush config"
            exit 1
          fi
          SMS_READ_JS="$("$UNSQUASHFS" -cat "$ROOTFS" www/luci-static/resources/view/c8modem/sms-read.js)"
          if ! printf '%s' "$SMS_READ_JS" | grep -q 'SMS_EXEC_TIMEOUT'; then
            echo "::error::C8 SMS read page is missing command timeout guard"
            exit 1
          fi
          echo "OK: C8 SMS timeout guards and WeChatPush isolation are enforced"

          reject_rootfs 'usr/lib/lua/luci/model/cbi/smsconfig\.lua' 'legacy LuCI SMS config CBI'
          reject_rootfs 'usr/lib/lua/luci/c8modem/safe\.lua' 'legacy C8 LuCI Lua helper'
          reject_rootfs 'usr/lib/lua/luci/controller/sms\.lua' 'legacy C8 SMS LuCI API controller'
          reject_rootfs 'usr/lib/lua/luci/controller/modem\.lua' 'legacy C8 modem LuCI API controller'
          reject_rootfs 'usr/lib/lua/luci/model/cbi/modem\.lua' 'legacy C8 modem settings CBI'
          reject_rootfs 'usr/lib/lua/luci/view/zmode/net_status\.htm' 'legacy C8 modem status view'
          reject_rootfs 'usr/lib/lua/luci/view/zmode/at\.htm' 'legacy C8 modem AT view'
          reject_rootfs 'usr/lib/lua/luci/view/modem/readsms\.htm' 'legacy LuCI read SMS view'
          reject_rootfs 'usr/lib/lua/luci/view/modem/sendsms\.htm' 'legacy LuCI send SMS view'
          reject_rootfs 'usr/share/rpcd/acl\.d/luci-app-sms-tool\.json' 'legacy LuCI SMS ACL'
          reject_rootfs 'usr/share/luci/menu\.d/luci-app-wechatpush\.json' 'standalone WeChatPush LuCI app'
          reject_rootfs 'www/luci-static/resources/view/wechatpush/' 'standalone WeChatPush views'
          reject_rootfs 'usr/share/wechatpush/' 'standalone WeChatPush backend'
          reject_rootfs 'etc/config/wechatpush' 'standalone WeChatPush config'
          reject_rootfs 'usr/bin/xray' 'legacy xray proxy core'
          reject_rootfs 'usr/bin/v2ray' 'legacy v2ray proxy core'
          reject_rootfs 'usr/bin/mihomo' 'legacy mihomo proxy core'
          reject_rootfs 'usr/bin/clash' 'legacy clash proxy core'
          reject_rootfs 'usr/bin/ss-redir' 'legacy shadowsocks-libev redir'
          reject_rootfs 'usr/share/luci/menu\.d/luci-app-passwall.*\.json' 'legacy PassWall LuCI app'
          reject_rootfs 'usr/share/luci/menu\.d/luci-app-openclash\.json' 'legacy OpenClash LuCI app'

          STATUS_PATHS="$(sed -n 's#.*squashfs-root/\(www/luci-static/resources/view/status.*/10_system\.js\)$#\1#p' "$ROOTFS_LIST")"
          if [ -z "$STATUS_PATHS" ]; then
            echo "::error::LuCI system status JS was not found in firmware rootfs"
            exit 1
          fi
          STATUS_MARKER_COUNT=0
          while IFS= read -r STATUS_PATH; do
            [ -n "$STATUS_PATH" ] || continue
            STATUS_TEXT="$("$UNSQUASHFS" -cat "$ROOTFS" "$STATUS_PATH")"
            CURRENT_MARKER_COUNT="$(printf '%s' "$STATUS_TEXT" | grep -o " / $WRT_MARK-" | wc -l | tr -d '[:space:]')"
            STATUS_MARKER_COUNT=$((STATUS_MARKER_COUNT + CURRENT_MARKER_COUNT))
            if [ "$CURRENT_MARKER_COUNT" -gt 0 ] && ! printf '%s' "$STATUS_TEXT" | grep -q " / $WRT_MARK-$WRT_DATE"; then
              echo "::error::LuCI status marker in $STATUS_PATH is stale"
              printf '%s\n' "$STATUS_TEXT" | grep -o "$WRT_MARK-[^']*" || true
              exit 1
            fi
          done <<< "$STATUS_PATHS"
          if [ "$STATUS_MARKER_COUNT" -ne 1 ]; then
            echo "::error::expected exactly one LuCI build marker in rootfs, found $STATUS_MARKER_COUNT"
            for STATUS_PATH in $STATUS_PATHS; do
              "$UNSQUASHFS" -cat "$ROOTFS" "$STATUS_PATH" | grep -o "$WRT_MARK-[^']*" || true
            done
            exit 1
          fi
          echo "OK: LuCI build marker is current and unique"

          ROOT_SHADOW="$("$UNSQUASHFS" -cat "$ROOTFS" etc/shadow | sed -n 's/^root:\([^:]*\):.*/\1/p')"
          if [ -z "$ROOT_SHADOW" ]; then
            echo "::error::root password hash is empty in firmware rootfs"
            exit 1
          fi
          echo "OK: root password hash is set"

          MODEM_SIMSEL="$("$UNSQUASHFS" -cat "$ROOTFS" etc/config/modem | sed -n "s/^[[:space:]]*option[[:space:]]\\+simsel[[:space:]]\\+'\\([^']*\\)'.*/\\1/p" | head -1)"
          if [ "$MODEM_SIMSEL" != "0" ]; then
            echo "::error::modem default simsel should be 0 (external SIM), got '$MODEM_SIMSEL'"
            exit 1
          fi
          echo "OK: modem default SIM is external"

          MODEM_CONFIG="$("$UNSQUASHFS" -cat "$ROOTFS" etc/config/modem)"
          if ! printf '%s' "$MODEM_CONFIG" | grep -q "option enable '1'"; then
            echo "::error::modem is not enabled by default"
            exit 1
          fi
          if ! printf '%s' "$SMS_TOOL_CONFIG" | grep -q "option readport '/dev/ttyUSB2'"; then
            echo "::error::SMS read port default is missing"
            exit 1
          fi
          if ! printf '%s' "$SMS_TOOL_CONFIG" | grep -q "option sendport '/dev/ttyUSB2'"; then
            echo "::error::SMS send port default is missing"
            exit 1
          fi
          if ! printf '%s' "$SMS_TOOL_CONFIG" | grep -q "config forward_channel 'ops_pushplus'"; then
            echo "::error::primary SMS forwarding channel is missing"
            exit 1
          fi
          if ! printf '%s' "$SMS_TOOL_CONFIG" | grep -q "config forward_channel 'backup_telegram'"; then
            echo "::error::backup SMS forwarding channel is missing"
            exit 1
          fi

          C8_DEFAULTS="$("$UNSQUASHFS" -cat "$ROOTFS" etc/uci-defaults/99-v12-defaults.sh)"
          for REQUIRED_DEFAULT in \
            "network.wan.device='eth1'" \
            "network.wan.proto='dhcp'" \
            "network.wan6.proto='dhcpv6'" \
            "dhcp.lan.dhcpv6='relay'" \
            "network.globals.packet_steering='1'" \
            "firewall.@defaults[0].flow_offloading_hw='1'"
          do
            if ! printf '%s' "$C8_DEFAULTS" | grep -Fq "$REQUIRED_DEFAULT"; then
              echo "::error::C8 default network setting missing: $REQUIRED_DEFAULT"
              exit 1
            fi
          done
          echo "OK: C8 cellular WAN, IPv6 relay, DNS/DHCP path, and SMS channel defaults are present"

      - name: Cleanup Old Releases
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP="${{ inputs.keep_releases }}"
          case "$KEEP" in
            ''|*[!0-9]*) KEEP=3 ;;
          esac
          RELEASES=$(gh release list --json tagName,publishedAt --limit 100 --jq '
            [
              .[] | select(
                (.tagName | startswith("c8-660-open-")) or
                ((.tagName | startswith("immortalwrt-c8-660-")) and ((.tagName | startswith("immortalwrt-c8-660-closed-")) | not)) or
                (.tagName | startswith("NRADIO-C8-660-immortalwrt-openwrt-25.12-")) or
                (.tagName | startswith("NRADIO-C8-660-immortalwrt-master-"))
              )
            ] | sort_by(.publishedAt) | .[0:-'"$KEEP"'] | .[].tagName
          ' 2>/dev/null) || true
          for TAG in $RELEASES; do
            echo "Deleting release and tag: $TAG"
            gh release delete "$TAG" --yes 2>/dev/null || true
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" 2>/dev/null || true
          done
          echo "Cleanup done (kept last $KEEP releases)"

      - name: Release Firmware
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{env.RELEASE_TAG}}
          name: C8-660 Open (mt76) ${{env.RELEASE_DATE}} ${{env.RELEASE_TIME}}
          fail_on_unmatched_files: true
          files: |
            ./wrt/upload/immortalwrt-c8-660-factory.bin
            ./wrt/upload/immortalwrt-c8-660-sysupgrade.bin
            ./wrt/upload/immortalwrt-c8-660-initramfs.bin
            ./wrt/upload/mt7981-bl2.bin
            ./wrt/upload/immortalwrt-c8-660.manifest
            ./wrt/upload/sha256sums
          body: |
            ## C8-660 Open 固件

            **下载**
            - 首次刷入：`immortalwrt-c8-660-factory.bin`
            - 系统升级：`immortalwrt-c8-660-sysupgrade.bin`
            - 校验文件：`sha256sums`

            **构建**
            - 类型：Open / mt76 / mainline
            - 时间：${{env.RELEASE_DATE}} ${{env.RELEASE_TIME}} Asia/Shanghai
            - 源码：${{env.WRT_REPO}} (${{env.WRT_BRANCH}}) @ ${{env.WRT_HASH}}
            - 内核：${{env.WRT_KVER}}
            - 地址：${{env.WRT_IP}}

            **重要**
            - 首次刷入会替换原厂系统，请先备份 BL2 / FIP。
            - Open 与 Closed 固件不通用。
            - 详细刷机说明见 [README](https://github.com/${{github.repository}}#使用流程)。

      - name: Upload Firmware Artifact
        if: ${{ inputs.publish_release == false }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: firmware-${{env.WRT_CONFIG}}-${{env.WRT_DATE}}
          path: ./wrt/upload/
          retention-days: 7
          if-no-files-found: error

      - name: Clean Build Workspace
        if: always()
        run: |
          cd ./wrt/
          rm -rf build_dir tmp logs bin 2>/dev/null || true
          rm -rf staging_dir/target* 2>/dev/null || true
          rm -f .config.old 2>/dev/null || true

# ImmortalWrt 固件编译 — NRadio C8-660 (MT7981)
name: C8-660 Open (mt76)

on:
  workflow_dispatch:
    inputs:
      wrt_branch:
        description: "ImmortalWrt branch to build"
        required: true
        default: "master"
        type: string
      wrt_ref:
        description: "Optional ImmortalWrt commit, tag, or ref override"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish firmware to GitHub Releases"
        required: true
        default: true
        type: boolean
      debug_dump:
        description: "Print target DUMP diagnostics"
        required: true
        default: false
        type: boolean
      enable_wed:
        description: "Enable mt76 WED hardware offload"
        required: true
        default: true
        type: boolean
      enable_flow_offloading:
        description: "Enable firewall flow offloading"
        required: true
        default: true
        type: boolean
      keep_releases:
        description: "Number of recent releases to keep"
        required: true
        default: "3"
        type: string

permissions:
  contents: read

env:
  WRT_CONFIG: NRADIO-C8-660
  WRT_THEME: aurora
  WRT_NAME: NRadio-C8-660
  WRT_SSID: NRadio
  WRT_IP: 192.168.1.1
  WRT_REPO: https://github.com/immortalwrt/immortalwrt
  WRT_BRANCH: ${{ inputs.wrt_branch || 'master' }}
  WRT_REF: ${{ inputs.wrt_ref || '' }}
  ENABLE_WED: ${{ inputs.enable_wed }}
  ENABLE_FLOW_OFFLOADING: ${{ inputs.enable_flow_offloading }}

jobs:
  build:
    name: immortalwrt-c8-660
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Projects
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox 2>/dev/null || true
          sudo -E apt -yqq update && sudo -E apt -yqq full-upgrade && sudo -E apt -yqq install -y dos2unix libfuse-dev git curl wget file jq unzip && sudo -E apt -yqq autoremove --purge && sudo -E apt -yqq autoclean
          curl -fsSL --retry 3 "https://build-scripts.immortalwrt.org/init_build_environment.sh" -o /tmp/init_build_env.sh
          INIT_BUILD_ACTUAL_SHA256="$(sha256sum /tmp/init_build_env.sh | cut -d' ' -f1)"
          INIT_BUILD_PIN_FILE="$GITHUB_WORKSPACE/.github/init_build_environment.sha256"
          INIT_BUILD_EXPECTED_SHA256="${INIT_BUILD_EXPECTED_SHA256:-${{ secrets.INIT_BUILD_EXPECTED_SHA256 || '' }}}"
          if [ -z "$INIT_BUILD_EXPECTED_SHA256" ] && [ -f "$INIT_BUILD_PIN_FILE" ]; then
            INIT_BUILD_EXPECTED_SHA256="$(tr -d '[:space:]' < "$INIT_BUILD_PIN_FILE")"
          fi
          echo "init_build_env.sh SHA256: $INIT_BUILD_ACTUAL_SHA256"
          if [ -n "$INIT_BUILD_EXPECTED_SHA256" ]; then
            echo "$INIT_BUILD_EXPECTED_SHA256 /tmp/init_build_env.sh" | sha256sum -c --status || {
              echo "::error::init_build_env.sh SHA256 MISMATCH — refusing to run"
              echo "::error::Expected: $INIT_BUILD_EXPECTED_SHA256"
              echo "::error::Actual:   $INIT_BUILD_ACTUAL_SHA256"
              exit 1
            }
            echo "init_build_env.sh SHA256 verified ✓"
          else
            echo "::error::No init_build_environment.sh SHA256 pin found"
            exit 1
          fi
          sudo bash /tmp/init_build_env.sh
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "CCACHE_DIR=$(pwd)/wrt/.ccache" >> $GITHUB_ENV
          RELEASE_DATE="$(TZ=Asia/Shanghai date +"%Y.%m.%d")"
          RELEASE_TIME="$(TZ=Asia/Shanghai date +"%H:%M")"
          RELEASE_STAMP="$(TZ=Asia/Shanghai date +"%Y%m%d-%H%M")"
          RUN_SUFFIX="r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          echo "WRT_DATE=${RELEASE_DATE}-${RELEASE_TIME//:/}" >> $GITHUB_ENV
          echo "RELEASE_DATE=${RELEASE_DATE}" >> $GITHUB_ENV
          echo "RELEASE_TIME=${RELEASE_TIME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=c8-660-open-${RELEASE_STAMP}-${RUN_SUFFIX}" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=immortalwrt" >> $GITHUB_ENV
          echo "WRT_TARGET=nradio_wt9103" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt/

          cd ./wrt/
          if [ -n "$WRT_REF" ]; then
            if git fetch --depth=1 origin "$WRT_REF"; then
              git checkout --detach FETCH_HEAD
            else
              git fetch --unshallow --tags origin "$WRT_BRANCH" || git fetch --tags origin "$WRT_BRANCH"
              git checkout --detach "$WRT_REF"
            fi
          fi
          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

      - name: Apply Patches
        run: |
          bash $GITHUB_WORKSPACE/Scripts/Patches.sh ./wrt/

      - name: Verify DTS
        run: |
          OK=true
          for DTS in ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts; do
            if [ -f "$DTS" ]; then echo "OK: Found $DTS";
            else echo "ERR: Missing $DTS"; OK=false; fi
          done
          if grep -q "nradio_wt9103" ./wrt/target/linux/mediatek/image/filogic.mk; then
            echo "OK: Device added to filogic.mk"
          else
            echo "ERR: Device NOT in filogic.mk"
            tail -5 ./wrt/target/linux/mediatek/image/filogic.mk
            OK=false
          fi
          if [ "$(grep -c '^define Device/nradio_wt9103$' ./wrt/target/linux/mediatek/image/filogic.mk)" = "1" ]; then
            echo "OK: exactly one C8-660 device definition"
          else
            echo "ERR: duplicate or missing nradio_wt9103 definition in filogic.mk"
            OK=false
          fi
          MK_BLOCK="$(awk '/^define Device\/nradio_wt9103$/,/^endef$/' ./wrt/target/linux/mediatek/image/filogic.mk)"
          if printf '%s' "$MK_BLOCK" | grep -q 'kmod-mt7915e' && ! printf '%s' "$MK_BLOCK" | grep -Eq 'kmod-mt_wifi|kmod-conninfra|kmod-mediatek_hnat|kmod-warp|hnat-detect|mtwifi-cfg-ucode'; then
            echo "OK: device packages are the open mt76 set (no closed vendor leak)"
          else
            echo "ERR: closed vendor packages leaked into the open device definition"
            printf '%s\n' "$MK_BLOCK"
            OK=false
          fi
          if grep -q 'gmac1: mac@1' ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts && grep -q 'phy-handle = <&phy6>;' ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts; then
            echo "OK: eth1 uses external 2.5G PHY"
          else
            echo "ERR: eth1/gmac1 is not bound to phy6"
            awk '/gmac1: mac@1/,/};/' ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts
            OK=false
          fi
          if grep -q 'macaddr_bdinfo_9: macaddr@9' ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts && \
             grep -q 'compatible = "mac-base"' ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts && \
             grep -q 'band@0' ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts && \
             grep -q 'nvmem-cells = <&macaddr_bdinfo_9 2>;' ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts && \
             grep -q 'band@1' ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts && \
             grep -q 'nvmem-cells = <&macaddr_bdinfo_9 3>;' ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts; then
            echo "OK: WiFi driver gets stable per-band MACs from bdinfo nvmem"
          else
            echo "ERR: WiFi driver MAC nvmem binding missing"
            awk '/factory: partition@180000/,/partition@380000/' ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts
            awk '/&wifi/,/};/' ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts
            OK=false
          fi
          if ! $OK; then exit 1; fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iname "*.sh" -exec dos2unix {} \; -exec chmod +x {} \;
          find ./ -maxdepth 3 -type f -iname "*.txt" -exec dos2unix {} \;
          find ./ -maxdepth 3 -type f -iname "*.mk" -exec dos2unix {} \;

      - name: Validate C8 Modem Overlay
        run: |
          set -euo pipefail

          bash "$GITHUB_WORKSPACE/Scripts/TestC8SmsForward.sh"
          bash "$GITHUB_WORKSPACE/Scripts/TestC8SmsForwardLuCI.sh"
          TMP_WRT="$(mktemp -d)"
          trap 'rm -rf "$TMP_WRT"' EXIT
          bash "$GITHUB_WORKSPACE/Scripts/InstallC8Overlay.sh" "$TMP_WRT"
          node --check "$GITHUB_WORKSPACE/patches/files/www/luci-static/resources/view/c8modem/status.js"
          node --check "$GITHUB_WORKSPACE/patches/files/www/luci-static/resources/view/c8modem/signal.js"
          node --check "$GITHUB_WORKSPACE/patches/files/www/luci-static/resources/view/c8modem/settings.js"
          node --check "$GITHUB_WORKSPACE/patches/files/www/luci-static/resources/view/c8modem/at.js"
          node --check "$GITHUB_WORKSPACE/patches/files/www/luci-static/resources/view/c8modem/cellscan.js"
          node --check "$GITHUB_WORKSPACE/patches/files/www/luci-static/resources/view/c8modem/sms-read.js"
          node --check "$GITHUB_WORKSPACE/patches/files/www/luci-static/resources/view/c8modem/sms-send.js"
          node --check "$GITHUB_WORKSPACE/patches/files/www/luci-static/resources/view/c8modem/sms-settings.js"
          node --check "$GITHUB_WORKSPACE/patches/files/www/luci-static/resources/view/c8modem/sms-forward.js"

      - name: Check Caches
        id: check-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/feeds
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*
            ./wrt/dl

      - name: Update Caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          if [ -d "./wrt/staging_dir" ]; then
            cd ./wrt/
            rm -rf build_dir staging_dir/target* tmp 2>/dev/null || true
            mkdir -p tmp && echo "1" > tmp/.build
            find "staging_dir" -type d -name "stamp" -not -path "*target*" 2>/dev/null | while read -r DIR; do
              find "$DIR" -type f -exec touch {} + 2>/dev/null || true
            done
            echo "toolchain clean done!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" --limit 100 | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Load Proxy Locks
        run: |
          set -euo pipefail

          PROXY_ENABLED=false
          for CFG in \
            "$GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt" \
            "$GITHUB_WORKSPACE/Config/OPEN.txt" \
            "$GITHUB_WORKSPACE/Config/GENERAL.txt" \
            "$GITHUB_WORKSPACE/Config/PRIVATE.txt"
          do
            if [ -f "$CFG" ] && grep -Eq '^CONFIG_PACKAGE_(luci-app-homeproxy|sing-box)=y$' "$CFG"; then
              PROXY_ENABLED=true
            fi
          done
          echo "PROXY_LOCKS_ENABLED=$PROXY_ENABLED" >> "$GITHUB_ENV"
          if [ "$PROXY_ENABLED" != "true" ]; then
            echo "HomeProxy/sing-box not enabled; skipping proxy locks"
            exit 0
          fi

          LOCK_FILE="$GITHUB_WORKSPACE/.github/proxy-locks.env"
          if [ ! -f "$LOCK_FILE" ]; then
            echo "::error::proxy lock file not found: $LOCK_FILE"
            exit 1
          fi

          validate_lock() {
            local key="$1"
            local value="$2"
            case "$key" in
              SING_BOX_TAG)
                [[ "$value" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]]
                ;;
              SING_BOX_VERSION)
                [[ "$value" =~ ^[0-9]+(\.[0-9]+){1,3}$ ]]
                ;;
              SING_BOX_HASH)
                [[ "$value" =~ ^[0-9a-f]{64}$ ]]
                ;;
              PKG_LOCK_homeproxy_BRANCH)
                [[ "$value" =~ ^[A-Za-z0-9._/-]+$ ]]
                ;;
              PKG_LOCK_homeproxy_COMMIT)
                [[ "$value" =~ ^[0-9a-f]{40}$ ]]
                ;;
              *)
                return 1
                ;;
            esac
          }

          while IFS='=' read -r KEY VALUE; do
            [ -n "$KEY" ] || continue
            case "$KEY" in \#*) continue ;; esac
            VALUE="${VALUE%$'\r'}"
            if ! validate_lock "$KEY" "$VALUE"; then
              echo "::error::invalid proxy lock entry: $KEY"
              exit 1
            fi
            printf '%s=%s\n' "$KEY" "$VALUE" >> "$GITHUB_ENV"
          done < "$LOCK_FILE"

      - name: Apply sing-box lock
        run: |
          if [ "${PROXY_LOCKS_ENABLED:-false}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/Scripts/ApplyProxyLocks.sh" ./wrt/
          else
            echo "HomeProxy/sing-box not enabled; skipping sing-box lock"
          fi

      - name: Patch LuCI JS (fix formatStats crash)
        run: |
          cd ./wrt/
          FILE=$(find feeds/luci -path "*/29_ports.js" -print -quit 2>/dev/null)
          [ -n "$FILE" ] && [ -f "$FILE" ] || { echo "29_ports.js NOT FOUND in feeds/luci"; exit 1; }
          echo "Patching: $FILE"
          # 注入安全转换函数 n() — undefined 转 0
          sed -i "s/const stats = portdev._devstate('stats') || {};/const stats = portdev._devstate('stats') || {}, n=v=>+v||0;/" "$FILE"
          # 用 n() 包裹所有 stats.* 调用
          for PROP in rx_bytes rx_packets multicast rx_errors rx_dropped tx_bytes tx_packets tx_errors tx_dropped; do
            sed -i "s/\\.format(stats\\.$PROP)/.format(n(stats.$PROP))/g" "$FILE"
          done
          echo "Patched: $FILE"

      - name: Patch LuCI Wireless Security
        run: |
          bash $GITHUB_WORKSPACE/Scripts/PatchWirelessSecurity.sh ./wrt/

      - name: Debug Custom Packages
        if: failure()
        run: |
          echo "=== PWD ===" && pwd
          echo "=== WRT Root ===" && ls -la ./wrt/ | head -20
          echo "=== Package Dir ===" && ls -la ./wrt/package/ 2>&1 | head -20
          echo "=== Feeds ===" && ls ./wrt/feeds/ 2>&1 || true
          echo "=== Scripts ===" && ls -la "$GITHUB_WORKSPACE/Scripts/"
          [ -f "$GITHUB_WORKSPACE/Scripts/Packages.sh" ] && echo "OK: Packages.sh EXISTS" || echo "ERR: Packages.sh MISSING"
          [ -x "$GITHUB_WORKSPACE/Scripts/Packages.sh" ] && echo "OK: Packages.sh EXECUTABLE" || echo "ERR: Packages.sh NOT EXECUTABLE"
          echo "=== Git ===" && git --version
          echo "=== jq ===" && jq --version 2>&1
          echo "=== Network ===" && curl -fsSL -o /dev/null -w "github.com:%{http_code}\n" https://github.com/eamonxg/luci-theme-aurora 2>&1

      - name: Custom Packages
        run: |
          set -o pipefail
          trap 'echo "::error::Failed at line $LINENO with exit $?" >&2' ERR

          cd ./wrt/package/ || { echo "::error::cd ./wrt/package/ failed" >&2; exit 1; }

          {
            $GITHUB_WORKSPACE/Scripts/Packages.sh
            $GITHUB_WORKSPACE/Scripts/Handles.sh
          } 2>&1 | tee /tmp/packages.log

      - name: Debug DUMP Output
        if: ${{ inputs.debug_dump }}
        run: |
          cd ./wrt/
          echo "=== DUMP output for nradio (image dir) ==="
          make -C target/linux/mediatek/image DUMP=1 SUBTARGET=filogic 2>&1 | grep -i nradio || echo "WARN: nradio NOT in DUMP output"
          echo ""
          echo "=== DUMP output for nradio (target dir) ==="
          make -C target/linux/mediatek DUMP=1 SUBTARGET=filogic 2>&1 | grep -i nradio || echo "WARN: nradio NOT in DUMP output (target)"
          echo ""
          echo "=== Last 30 lines of filogic.mk ==="
          tail -30 target/linux/mediatek/image/filogic.mk
          echo ""
          echo "=== filogic.mk file info ==="
          file target/linux/mediatek/image/filogic.mk
          wc -l target/linux/mediatek/image/filogic.mk

      - name: Custom Settings
        env:
          WRT_WORD: ${{ secrets.WRT_WORD || '' }}
          WRT_PW: ${{ secrets.WRT_PW || '' }}
        run: |
          cd ./wrt/
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"

          cat \
            $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt \
            $GITHUB_WORKSPACE/Config/OPEN.txt \
            $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          echo "=== .config before defconfig ==="
          grep '^CONFIG_TARGET' .config || echo "No CONFIG_TARGET lines in .config"

          if ! make defconfig -j$(nproc); then
            echo "ERROR: make defconfig failed!"
            cat .config
            exit 1
          fi

          echo "=== .config after defconfig ==="
          grep '^CONFIG_TARGET' .config || echo "No CONFIG_TARGET lines after defconfig"

          echo ""
          echo "=== tmp/.targetinfo nradio lines ==="
          grep -i nradio tmp/.targetinfo 2>/dev/null || echo "nradio NOT in .targetinfo"

          echo ""
          echo "=== tmp/.config-target.in nradio lines ==="
          grep -i nradio tmp/.config-target.in 2>/dev/null || echo "nradio NOT in .config-target.in"

          echo ""
          echo "=== defconfig target entries ==="
          grep -E '^CONFIG_TARGET' .config

          SELECTED_DEVICE=$(grep -oP '^CONFIG_TARGET_DEVICE_[\w]+_DEVICE_\K[\w-]+(?=\=y)' .config | head -1)
          echo "Selected device: '$SELECTED_DEVICE'"
          if [ "$SELECTED_DEVICE" != "nradio_wt9103" ]; then
            echo "::error::WRONG DEVICE: expected nradio_wt9103, got '$SELECTED_DEVICE'"
            exit 1
          fi
          echo "OK: Device nradio_wt9103 selected correctly"

      - name: Download Packages
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Check Disk Space
        run: |
          echo "=== DISK SPACE AFTER DOWNLOAD ==="
          df -h
          echo "=== TOP 10 LARGE DIRS ==="
          du -sh ./wrt/* 2>/dev/null | sort -rh | head -10

      - name: Compile Firmware
        timeout-minutes: ${{ steps.check-cache.outputs.cache-hit == 'true' && 120 || 300 }}
        run: |
          cd ./wrt/
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"

          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "=== BUILD FAILED — LAST 50 ERRORS ==="
            echo "========================================"
            grep -iE 'error|conflict|failed|No such|No rule|cannot|denied' build.log | tail -50
            exit 1
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-log-${{env.WRT_CONFIG}}
          path: ./wrt/build.log
          retention-days: 3
          if-no-files-found: warn

      - name: Upload Packages Debug
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: packages-debug-${{env.WRT_CONFIG}}
          path: /tmp/packages.log
          retention-days: 3
          if-no-files-found: warn

      - name: Upload Config Snapshot
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: config-snapshot-${{env.WRT_CONFIG}}
          path: |
            ./wrt/.config
            ./wrt/tmp/.targetinfo
            ./wrt/tmp/.config-target.in
          retention-days: 3
          if-no-files-found: warn

      - name: Machine Information
        if: failure()
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/
          rm -rf ./upload/
          mkdir -p ./upload/

          KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \; | head -1)
          LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')
          echo "WRT_KVER=${KVER:-unknown}" >> $GITHUB_ENV
          echo "WRT_LIST=${LIST:-none}" >> $GITHUB_ENV

          find ./bin/targets/ -iregex ".*\(buildinfo\|json\|packages\)$" -exec rm -rf {} +

          copy_unique_artifact() {
            local pattern="$1"
            local output="$2"
            local desc="$3"
            mapfile -t MATCHES < <(find ./bin/targets/ -type f -iname "$pattern" | sort)
            if [ "${#MATCHES[@]}" -ne 1 ]; then
              echo "::error::Expected exactly one $desc matching $pattern, found ${#MATCHES[@]}"
              printf '%s\n' "${MATCHES[@]}"
              exit 1
            fi
            cp -f "${MATCHES[0]}" "./upload/$output"
            echo "Packaged $desc: ${MATCHES[0]} -> ./upload/$output"
          }

          copy_unique_artifact '*squashfs-factory*.bin' 'immortalwrt-c8-660-factory.bin' 'factory image'
          copy_unique_artifact '*squashfs-sysupgrade*.bin' 'immortalwrt-c8-660-sysupgrade.bin' 'sysupgrade image'
          copy_unique_artifact '*initramfs*.bin' 'immortalwrt-c8-660-initramfs.bin' 'initramfs image'
          copy_unique_artifact '*mt7981*ddr4*bl2*.bin' 'mt7981-bl2.bin' 'MT7981 DDR4 BL2'
          copy_unique_artifact '*.manifest' 'immortalwrt-c8-660.manifest' 'package manifest'

          (
            cd ./upload/
            sha256sum \
              immortalwrt-c8-660-factory.bin \
              immortalwrt-c8-660-sysupgrade.bin \
              immortalwrt-c8-660-initramfs.bin \
              mt7981-bl2.bin \
              immortalwrt-c8-660.manifest \
              > sha256sums
          )

          REQUIRED_FILES="
          ./upload/immortalwrt-c8-660-factory.bin
          ./upload/immortalwrt-c8-660-sysupgrade.bin
          ./upload/immortalwrt-c8-660-initramfs.bin
          ./upload/mt7981-bl2.bin
          ./upload/immortalwrt-c8-660.manifest
          ./upload/sha256sums
          "
          for FILE in $REQUIRED_FILES; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Required firmware artifact missing or empty: $FILE"
              find ./upload/ -maxdepth 1 -type f -print | sort
              exit 1
            fi
          done
          find ./upload/ -maxdepth 1 -type f -print | sort

      - name: Validate Firmware Rootfs
        run: |
          cd ./wrt/

          SYSUPGRADE="./upload/immortalwrt-c8-660-sysupgrade.bin"
          EXTRACT_DIR="$(mktemp -d)"
          ROOTFS_LIST="/tmp/c8-660-rootfs.list"
          UNSQUASHFS="./staging_dir/host/bin/unsquashfs"

          [ -s "$SYSUPGRADE" ] || { echo "::error::Missing sysupgrade image: $SYSUPGRADE"; exit 1; }
          tar -xf "$SYSUPGRADE" -C "$EXTRACT_DIR"
          ROOTFS="$(find "$EXTRACT_DIR" -type f -name root | head -1)"
          [ -s "$ROOTFS" ] || { echo "::error::Missing rootfs inside sysupgrade image"; find "$EXTRACT_DIR" -maxdepth 3 -type f -print; exit 1; }
          [ -x "$UNSQUASHFS" ] || UNSQUASHFS="$(command -v unsquashfs || true)"
          [ -n "$UNSQUASHFS" ] && [ -x "$UNSQUASHFS" ] || { echo "::error::unsquashfs not found"; exit 1; }

          "$UNSQUASHFS" -ll "$ROOTFS" > "$ROOTFS_LIST"
          MANIFEST_FILE="/tmp/c8-660-manifests.list"
          : > "$MANIFEST_FILE"
          while IFS= read -r -d '' MANIFEST; do
            cat "$MANIFEST" >> "$MANIFEST_FILE"
          done < <(find ./upload/ -maxdepth 1 -type f -name "*.manifest" -size +0c -print0 | sort -z)
          [ -s "$MANIFEST_FILE" ] || { echo "::error::Required manifest artifact missing"; exit 1; }

          require_rootfs() {
            local pattern="$1"
            local desc="$2"
            if grep -Eq "$pattern" "$ROOTFS_LIST"; then
              echo "OK: $desc"
            else
              echo "::error::Missing $desc ($pattern)"
              grep -Ei 'mt76|mt7915|mt7981|mac80211|cfg80211|qmi|sms|sendat|modem|luci|wireless|firewall|aurora' "$ROOTFS_LIST" | tail -120 || true
              exit 1
            fi
          }

          reject_rootfs() {
            local pattern="$1"
            local desc="$2"
            if grep -Eq "$pattern" "$ROOTFS_LIST"; then
              echo "::error::Unexpected file in rootfs: $desc ($pattern)"
              grep -E "$pattern" "$ROOTFS_LIST" || true
              exit 1
            fi
            echo "OK: no $desc"
          }

          config_enabled() {
            grep -qs "^CONFIG_PACKAGE_$1=y$" .config
          }

          require_manifest_package() {
            local pkg="$1"
            if grep -Eq "^${pkg}[[:space:]]+-[[:space:]]+" "$MANIFEST_FILE"; then
              echo "OK: manifest contains $pkg"
            else
              echo "::error::Missing manifest package: $pkg"
              grep -E "^(luci-app-|sing-box|luci-app-wolultra|kmod-nft-|kmod-mtd-rw|tcpdump|openssh-sftp-server|socat|ttyd|miniupnpd|etherwake|zerotier)" "$MANIFEST_FILE" || true
              exit 1
            fi
          }

          reject_manifest_package() {
            local pkg="$1"
            if grep -Eq "^${pkg}[[:space:]]+-[[:space:]]+" "$MANIFEST_FILE"; then
              echo "::error::Unexpected manifest package: $pkg"
              grep -E "^${pkg}[[:space:]]+-[[:space:]]+" "$MANIFEST_FILE" || true
              exit 1
            fi
            echo "OK: manifest excludes $pkg"

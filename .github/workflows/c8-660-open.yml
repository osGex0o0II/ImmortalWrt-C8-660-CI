            reject_rootfs 'usr/bin/zerotier-one' 'ZeroTier daemon'
          fi
          if config_enabled 'tcpdump' || config_enabled 'tcpdump-mini'; then
            require_rootfs 'usr/(s)?bin/tcpdump' 'tcpdump packet capture tool'
          else

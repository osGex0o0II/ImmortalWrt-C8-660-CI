            reject_rootfs 'usr/sbin/miniupnpd' 'miniupnpd daemon'
          fi
          reject_rootfs 'usr/share/luci/menu\.d/luci-app-wol\.json' 'LuCI Wake-on-LAN app'
          if config_enabled 'luci-app-wolultra'; then
            require_rootfs 'usr/share/luci/menu\.d/luci-app-wolultra\.json' 'LuCI WOL Ultra app'
            require_rootfs 'www/luci-static/resources/view/wolultra\.js' 'LuCI WOL Ultra view'
            require_rootfs 'etc/config/wolultra' 'WOL Ultra UCI config'
            require_rootfs 'etc/init\.d/wolultra' 'WOL Ultra init service'
            require_rootfs 'usr/share/rpcd/ucode/luci\.wolultra' 'WOL Ultra RPC backend'
          else
            reject_rootfs 'usr/share/luci/menu\.d/luci-app-wolultra\.json' 'LuCI WOL Ultra app'
            reject_rootfs 'www/luci-static/resources/view/wolultra\.js' 'LuCI WOL Ultra view'
          fi
          if config_enabled 'etherwake' || config_enabled 'luci-app-wolultra'; then
            require_rootfs 'usr/bin/etherwake' 'etherwake helper'
          else
            reject_rootfs 'usr/bin/etherwake' 'etherwake helper'
          fi
          if config_enabled 'luci-app-zerotier'; then
            require_rootfs 'usr/share/luci/menu\.d/luci-app-zerotier\.json' 'LuCI ZeroTier app'
            require_rootfs 'www/luci-static/resources/view/zerotier/config\.js' 'LuCI ZeroTier config page'
          else
            reject_rootfs 'usr/share/luci/menu\.d/luci-app-zerotier\.json' 'LuCI ZeroTier app'
            reject_rootfs 'www/luci-static/resources/view/zerotier/config\.js' 'LuCI ZeroTier config page'
          fi
          if config_enabled 'luci-app-zerotier' || config_enabled 'zerotier'; then
            require_rootfs 'etc/init\.d/zerotier' 'ZeroTier init service'
            require_rootfs 'usr/bin/zerotier-one' 'ZeroTier daemon'
          else

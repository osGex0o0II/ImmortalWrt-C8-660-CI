          require_rootfs 'usr/share/luci/menu\.d/luci-mod-status\.json' 'LuCI status menu'
          require_rootfs 'usr/share/luci/menu\.d/luci-mod-system\.json' 'LuCI system menu'
          require_rootfs 'usr/share/luci/menu\.d/luci-mod-network\.json' 'LuCI network menu'
          require_rootfs 'www/luci-static/resources/view/network/wireless\.js' 'LuCI wireless page'
          require_rootfs 'www/luci-static/resources/view/network/interfaces\.js' 'LuCI interfaces page'
          require_rootfs 'usr/share/luci/menu\.d/luci-app-firewall\.json' 'LuCI firewall app'
          if config_enabled 'luci-app-package-manager'; then

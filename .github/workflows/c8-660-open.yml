# ImmortalWrt 固件编译 — NRadio C8-660 (MT7981)
name: C8-660 Open (mt76)

on:
  workflow_dispatch:
    inputs:
      wrt_branch:
        description: "ImmortalWrt branch to build"
        required: true
        default: "master"
        type: string
      wrt_ref:
        description: "Optional ImmortalWrt commit, tag, or ref override"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Publish firmware to GitHub Releases"
        required: true
        default: true
        type: boolean
      debug_dump:
        description: "Print target DUMP diagnostics"
        required: true
        default: false
        type: boolean
      enable_wed:
        description: "Enable mt76 WED hardware offload"
        required: true
        default: true
        type: boolean
      enable_flow_offloading:
        description: "Enable firewall flow offloading"
        required: true
        default: true
        type: boolean
      keep_releases:
        description: "Number of recent releases to keep"
        required: true
        default: "3"
        type: string
      wrt_pw:
        description: "Optional root password override for this build"
        required: false
        default: ""
        type: string

permissions:
  contents: read

env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
  WRT_CONFIG: NRADIO-C8-660
  WRT_THEME: aurora
  WRT_NAME: NRadio-C8-660
  WRT_SSID: NRadio-WiFi
  WRT_WORD: ${{ secrets.WRT_WORD || '' }}
  WRT_IP: 192.168.1.1
  WRT_PW: ${{ inputs.wrt_pw || secrets.WRT_PW || '' }}
  WRT_REPO: https://github.com/immortalwrt/immortalwrt
  WRT_BRANCH: ${{ inputs.wrt_branch || 'master' }}
  WRT_REF: ${{ inputs.wrt_ref || '' }}
  ENABLE_WED: ${{ inputs.enable_wed }}
  ENABLE_FLOW_OFFLOADING: ${{ inputs.enable_flow_offloading }}

jobs:
  build:
    name: immortalwrt-c8-660
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout Projects
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - name: Initialization Environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt -yqq purge firefox 2>/dev/null || true
          sudo -E apt -yqq update && sudo -E apt -yqq full-upgrade && sudo -E apt -yqq install -y dos2unix libfuse-dev git curl wget file jq unzip && sudo -E apt -yqq autoremove --purge && sudo -E apt -yqq autoclean
          curl -fsSL --retry 3 "https://build-scripts.immortalwrt.org/init_build_environment.sh" -o /tmp/init_build_env.sh
          INIT_BUILD_ACTUAL_SHA256="$(sha256sum /tmp/init_build_env.sh | cut -d' ' -f1)"
          INIT_BUILD_PIN_FILE="$GITHUB_WORKSPACE/.github/init_build_environment.sha256"
          INIT_BUILD_EXPECTED_SHA256="${INIT_BUILD_EXPECTED_SHA256:-${{ secrets.INIT_BUILD_EXPECTED_SHA256 || '' }}}"
          if [ -z "$INIT_BUILD_EXPECTED_SHA256" ] && [ -f "$INIT_BUILD_PIN_FILE" ]; then
            INIT_BUILD_EXPECTED_SHA256="$(tr -d '[:space:]' < "$INIT_BUILD_PIN_FILE")"
          fi
          echo "init_build_env.sh SHA256: $INIT_BUILD_ACTUAL_SHA256"
          if [ -n "$INIT_BUILD_EXPECTED_SHA256" ]; then
            echo "$INIT_BUILD_EXPECTED_SHA256 /tmp/init_build_env.sh" | sha256sum -c --status || {
              echo "::error::init_build_env.sh SHA256 MISMATCH — refusing to run"
              echo "::error::Expected: $INIT_BUILD_EXPECTED_SHA256"
              echo "::error::Actual:   $INIT_BUILD_ACTUAL_SHA256"
              exit 1
            }
            echo "init_build_env.sh SHA256 verified ✓"
          else
            echo "::error::No init_build_environment.sh SHA256 pin found"
            exit 1
          fi
          sudo bash /tmp/init_build_env.sh
          sudo -E systemctl daemon-reload
          sudo -E timedatectl set-timezone "Asia/Shanghai"

          sudo mkdir -p /mnt/build_wrt
          sudo chown $USER:$USER /mnt/build_wrt
          sudo ln -s /mnt/build_wrt $GITHUB_WORKSPACE/wrt

      - name: Initialization Values
        run: |
          echo "CCACHE_DIR=$(pwd)/wrt/.ccache" >> $GITHUB_ENV
          RELEASE_DATE="$(TZ=Asia/Shanghai date +"%Y.%m.%d")"
          RELEASE_TIME="$(TZ=Asia/Shanghai date +"%H:%M")"
          RELEASE_STAMP="$(TZ=Asia/Shanghai date +"%Y%m%d-%H%M")"
          RUN_SUFFIX="r${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          echo "WRT_DATE=${RELEASE_DATE}-${RELEASE_TIME//:/}" >> $GITHUB_ENV
          echo "RELEASE_DATE=${RELEASE_DATE}" >> $GITHUB_ENV
          echo "RELEASE_TIME=${RELEASE_TIME}" >> $GITHUB_ENV
          echo "RELEASE_TAG=c8-660-open-${RELEASE_STAMP}-${RUN_SUFFIX}" >> $GITHUB_ENV
          echo "WRT_MARK=${GITHUB_REPOSITORY%%/*}" >> $GITHUB_ENV
          echo "WRT_INFO=immortalwrt" >> $GITHUB_ENV
          echo "WRT_TARGET=nradio_wt9103" >> $GITHUB_ENV
          echo "WRT_WIFI=wifi-yes" >> $GITHUB_ENV
          echo "WRT_KVER=none" >> $GITHUB_ENV
          echo "WRT_LIST=none" >> $GITHUB_ENV

      - name: Clone Code
        run: |
          git clone --depth=1 --single-branch --branch "$WRT_BRANCH" "$WRT_REPO" ./wrt/

          cd ./wrt/
          if [ -n "$WRT_REF" ]; then
            if git fetch --depth=1 origin "$WRT_REF"; then
              git checkout --detach FETCH_HEAD
            else
              git fetch --unshallow --tags origin "$WRT_BRANCH" || git fetch --tags origin "$WRT_BRANCH"
              git checkout --detach "$WRT_REF"
            fi
          fi
          echo "WRT_HASH=$(git log -1 --pretty=format:'%h')" >> $GITHUB_ENV

      - name: Apply Patches
        run: |
          bash $GITHUB_WORKSPACE/Scripts/Patches.sh ./wrt/

      - name: Verify DTS
        run: |
          OK=true
          for DTS in ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts; do
            if [ -f "$DTS" ]; then echo "OK: Found $DTS";
            else echo "ERR: Missing $DTS"; OK=false; fi
          done
          if grep -q "nradio_wt9103" ./wrt/target/linux/mediatek/image/filogic.mk; then
            echo "OK: Device added to filogic.mk"
          else
            echo "ERR: Device NOT in filogic.mk"
            tail -5 ./wrt/target/linux/mediatek/image/filogic.mk
            OK=false
          fi
          if grep -q 'gmac1: mac@1' ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts && grep -q 'phy-handle = <&phy6>;' ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts; then
            echo "OK: eth1 uses external 2.5G PHY"
          else
            echo "ERR: eth1/gmac1 is not bound to phy6"
            awk '/gmac1: mac@1/,/};/' ./wrt/target/linux/mediatek/dts/mt7981b-nradio-c8-660.dts
            OK=false
          fi
          if ! $OK; then exit 1; fi

      - name: Check Scripts
        run: |
          find ./ -maxdepth 3 -type f -iname "*.sh" -exec dos2unix {} \; -exec chmod +x {} \;
          find ./ -maxdepth 3 -type f -iname "*.txt" -exec dos2unix {} \;
          find ./ -maxdepth 3 -type f -iname "*.mk" -exec dos2unix {} \;

      - name: Check Caches
        id: check-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          key: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}-${{env.WRT_HASH}}
          restore-keys: ${{env.WRT_CONFIG}}-${{env.WRT_INFO}}
          path: |
            ./wrt/.ccache
            ./wrt/feeds
            ./wrt/staging_dir/host*
            ./wrt/staging_dir/tool*
            ./wrt/dl

      - name: Update Caches
        run: |
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"
          if [ -d "./wrt/staging_dir" ]; then
            cd ./wrt/
            rm -rf build_dir staging_dir/target* tmp 2>/dev/null || true
            mkdir -p tmp && echo "1" > tmp/.build
            find "staging_dir" -type d -name "stamp" -not -path "*target*" 2>/dev/null | while read -r DIR; do
              find "$DIR" -type f -exec touch {} + 2>/dev/null || true
            done
            echo "toolchain clean done!"
          else
            echo "caches missed!"
          fi

          if ${{steps.check-cache.outputs.cache-hit != 'true'}}; then
            CACHE_LIST=$(gh cache list --key "$WRT_CONFIG-$WRT_INFO" --limit 100 | cut -f 1)
            for CACHE_KEY in $CACHE_LIST; do
              gh cache delete $CACHE_KEY
            done

            echo "caches cleanup done!"
          fi

      - name: Update Feeds
        run: |
          cd ./wrt/

          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch LuCI JS (fix formatStats crash)
        run: |
          cd ./wrt/
          FILE=$(find feeds/luci -path "*/29_ports.js" -print -quit 2>/dev/null)
          [ -n "$FILE" ] && [ -f "$FILE" ] || { echo "29_ports.js NOT FOUND in feeds/luci"; exit 1; }
          echo "Patching: $FILE"
          # 注入安全转换函数 n() — undefined 转 0
          sed -i "s/const stats = portdev._devstate('stats') || {};/const stats = portdev._devstate('stats') || {}, n=v=>+v||0;/" "$FILE"
          # 用 n() 包裹所有 stats.* 调用
          for PROP in rx_bytes rx_packets multicast rx_errors rx_dropped tx_bytes tx_packets tx_errors tx_dropped; do
            sed -i "s/\\.format(stats\\.$PROP)/.format(n(stats.$PROP))/g" "$FILE"
          done
          echo "Patched: $FILE"

      - name: Debug Custom Packages
        if: failure()
        run: |
          echo "=== PWD ===" && pwd
          echo "=== WRT Root ===" && ls -la ./wrt/ | head -20
          echo "=== Package Dir ===" && ls -la ./wrt/package/ 2>&1 | head -20
          echo "=== Feeds ===" && ls ./wrt/feeds/ 2>&1 || true
          echo "=== Scripts ===" && ls -la "$GITHUB_WORKSPACE/Scripts/"
          [ -f "$GITHUB_WORKSPACE/Scripts/Packages.sh" ] && echo "OK: Packages.sh EXISTS" || echo "ERR: Packages.sh MISSING"
          [ -x "$GITHUB_WORKSPACE/Scripts/Packages.sh" ] && echo "OK: Packages.sh EXECUTABLE" || echo "ERR: Packages.sh NOT EXECUTABLE"
          echo "=== Git ===" && git --version
          echo "=== jq ===" && jq --version 2>&1
          echo "=== Network ===" && curl -fsSL -o /dev/null -w "github.com:%{http_code}\n" https://github.com/eamonxg/luci-theme-aurora 2>&1

      - name: Custom Packages
        run: |
          set -o pipefail
          trap 'echo "::error::Failed at line $LINENO with exit $?" >&2' ERR

          cd ./wrt/package/ || { echo "::error::cd ./wrt/package/ failed" >&2; exit 1; }

          {
            $GITHUB_WORKSPACE/Scripts/Packages.sh
            $GITHUB_WORKSPACE/Scripts/Handles.sh
          } 2>&1 | tee /tmp/packages.log

      - name: Debug DUMP Output
        if: ${{ inputs.debug_dump }}
        run: |
          cd ./wrt/
          echo "=== DUMP output for nradio (image dir) ==="
          make -C target/linux/mediatek/image DUMP=1 SUBTARGET=filogic 2>&1 | grep -i nradio || echo "WARN: nradio NOT in DUMP output"
          echo ""
          echo "=== DUMP output for nradio (target dir) ==="
          make -C target/linux/mediatek DUMP=1 SUBTARGET=filogic 2>&1 | grep -i nradio || echo "WARN: nradio NOT in DUMP output (target)"
          echo ""
          echo "=== Last 30 lines of filogic.mk ==="
          tail -30 target/linux/mediatek/image/filogic.mk
          echo ""
          echo "=== filogic.mk file info ==="
          file target/linux/mediatek/image/filogic.mk
          wc -l target/linux/mediatek/image/filogic.mk

      - name: Custom Settings
        run: |
          cd ./wrt/
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"

          cat \
            $GITHUB_WORKSPACE/Config/$WRT_CONFIG.txt \
            $GITHUB_WORKSPACE/Config/OPEN.txt \
            $GITHUB_WORKSPACE/Config/GENERAL.txt >> .config

          $GITHUB_WORKSPACE/Scripts/Settings.sh

          echo "=== .config before defconfig ==="
          grep '^CONFIG_TARGET' .config || echo "No CONFIG_TARGET lines in .config"

          if ! make defconfig -j$(nproc); then
            echo "ERROR: make defconfig failed!"
            cat .config
            exit 1
          fi

          echo "=== .config after defconfig ==="
          grep '^CONFIG_TARGET' .config || echo "No CONFIG_TARGET lines after defconfig"

          echo ""
          echo "=== tmp/.targetinfo nradio lines ==="
          grep -i nradio tmp/.targetinfo 2>/dev/null || echo "nradio NOT in .targetinfo"

          echo ""
          echo "=== tmp/.config-target.in nradio lines ==="
          grep -i nradio tmp/.config-target.in 2>/dev/null || echo "nradio NOT in .config-target.in"

          echo ""
          echo "=== defconfig target entries ==="
          grep -E '^CONFIG_TARGET' .config

          SELECTED_DEVICE=$(grep -oP '^CONFIG_TARGET_DEVICE_[\w]+_DEVICE_\K[\w-]+(?=\=y)' .config | head -1)
          echo "Selected device: '$SELECTED_DEVICE'"
          if [ "$SELECTED_DEVICE" != "nradio_wt9103" ]; then
            echo "::error::WRONG DEVICE: expected nradio_wt9103, got '$SELECTED_DEVICE'"
            exit 1
          fi
          echo "OK: Device nradio_wt9103 selected correctly"

      - name: Download Packages
        run: |
          cd ./wrt/

          make download -j$(nproc)

      - name: Check Disk Space
        run: |
          echo "=== DISK SPACE AFTER DOWNLOAD ==="
          df -h
          echo "=== TOP 10 LARGE DIRS ==="
          du -sh ./wrt/* 2>/dev/null | sort -rh | head -10

      - name: Compile Firmware
        timeout-minutes: ${{ steps.check-cache.outputs.cache-hit == 'true' && 120 || 300 }}
        run: |
          cd ./wrt/
          export CCACHE_DIR="${{ env.CCACHE_DIR }}"

          set -o pipefail
          make -j$(nproc) V=s 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo ""
            echo "========================================"
            echo "=== BUILD FAILED — LAST 50 ERRORS ==="
            echo "========================================"
            grep -iE 'error|conflict|failed|No such|No rule|cannot|denied' build.log | tail -50
            exit 1
          fi

      - name: Upload Build Log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: build-log-${{env.WRT_CONFIG}}
          path: ./wrt/build.log
          retention-days: 3
          if-no-files-found: warn

      - name: Upload Packages Debug
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: packages-debug-${{env.WRT_CONFIG}}
          path: /tmp/packages.log
          retention-days: 3
          if-no-files-found: warn

      - name: Upload Config Snapshot
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: config-snapshot-${{env.WRT_CONFIG}}
          path: |
            ./wrt/.config
            ./wrt/tmp/.targetinfo
            ./wrt/tmp/.config-target.in
          retention-days: 3
          if-no-files-found: warn

      - name: Machine Information
        if: failure()
        run: |
          cd ./wrt/

          echo "======================="
          lscpu | grep -E "name|Core|Thread"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1
          echo "======================="

      - name: Package Firmware
        run: |
          cd ./wrt/ && mkdir -p ./upload/

          KVER=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^kernel - \K[\d\.]+' {} \; | head -1)
          LIST=$(find ./bin/targets/ -type f -name "*.manifest" -exec grep -oP '^luci-(app|theme)[^ ]*' {} \; | tr '\n' ' ')
          echo "WRT_KVER=${KVER:-unknown}" >> $GITHUB_ENV
          echo "WRT_LIST=${LIST:-none}" >> $GITHUB_ENV

          find ./bin/targets/ -iregex ".*\(buildinfo\|json\|packages\)$" -exec rm -rf {} +

          # 保留关键镜像，统一命名
          find ./bin/targets/ -type f \( \
            -iname "*factory*" -o \
            -iname "*sysupgrade*" -o \
            -iname "*initramfs*" -o \
            -iname "*bl2*" -o \
            -iname "*manifest*" -o \
            -iname "*sha256sums*" -o \
            -iname "*.dtb" \
          \) -print | while IFS= read -r FILE; do
            BASENAME=$(basename "$FILE")
            cp -f "$FILE" "./upload/$BASENAME"
          done

          # 只保留 C8-660 所需的 BL2
          find ./upload/ -type f -iname "*bl2*" ! -iname "mt7981*" -delete

          # 固件重命名
          for FILE in ./upload/*.bin; do
            [ -f "$FILE" ] || continue
            BASE=$(basename "$FILE")
            case "$BASE" in
              *squashfs-factory*)  SHORT="immortalwrt-c8-660-factory.bin" ;;
              *squashfs-sysupgrade*) SHORT="immortalwrt-c8-660-sysupgrade.bin" ;;
              *initramfs*)        SHORT="immortalwrt-c8-660-initramfs.bin" ;;
              *bl2*)              SHORT="mt7981-bl2.bin" ;;
              *)                  continue ;;
            esac
            mv -f "$FILE" "./upload/$SHORT"
          done

          REQUIRED_FILES="
          ./upload/immortalwrt-c8-660-factory.bin
          ./upload/immortalwrt-c8-660-sysupgrade.bin
          ./upload/immortalwrt-c8-660-initramfs.bin
          ./upload/mt7981-bl2.bin
          ./upload/sha256sums
          "
          for FILE in $REQUIRED_FILES; do
            if [ ! -s "$FILE" ]; then
              echo "::error::Required firmware artifact missing or empty: $FILE"
              find ./upload/ -maxdepth 1 -type f -print | sort
              exit 1
            fi
          done
          if ! find ./upload/ -maxdepth 1 -type f -name "*.manifest" -size +0c | grep -q .; then
            echo "::error::Required manifest artifact missing"
            find ./upload/ -maxdepth 1 -type f -print | sort
            exit 1
          fi
          find ./upload/ -maxdepth 1 -type f -print | sort

      - name: Validate Firmware Rootfs
        run: |
          cd ./wrt/

          SYSUPGRADE="./upload/immortalwrt-c8-660-sysupgrade.bin"
          EXTRACT_DIR="$(mktemp -d)"
          ROOTFS_LIST="/tmp/c8-660-rootfs.list"
          UNSQUASHFS="./staging_dir/host/bin/unsquashfs"

          [ -s "$SYSUPGRADE" ] || { echo "::error::Missing sysupgrade image: $SYSUPGRADE"; exit 1; }
          tar -xf "$SYSUPGRADE" -C "$EXTRACT_DIR"
          ROOTFS="$(find "$EXTRACT_DIR" -type f -name root | head -1)"
          [ -s "$ROOTFS" ] || { echo "::error::Missing rootfs inside sysupgrade image"; find "$EXTRACT_DIR" -maxdepth 3 -type f -print; exit 1; }
          [ -x "$UNSQUASHFS" ] || UNSQUASHFS="$(command -v unsquashfs || true)"
          [ -n "$UNSQUASHFS" ] && [ -x "$UNSQUASHFS" ] || { echo "::error::unsquashfs not found"; exit 1; }

          "$UNSQUASHFS" -ll "$ROOTFS" > "$ROOTFS_LIST"

          require_rootfs() {
            local pattern="$1"
            local desc="$2"
            if grep -Eq "$pattern" "$ROOTFS_LIST"; then
              echo "OK: $desc"
            else
              echo "::error::Missing $desc ($pattern)"
              grep -Ei 'mt76|mt7915|mt7981|mac80211|cfg80211|qmi|sms|sendat|modem|luci|wireless|firewall|aurora|partexp|ttyd|upnp|wol|nlbw' "$ROOTFS_LIST" | tail -120 || true
              exit 1
            fi
          }

          # mt76 WiFi stack
          require_rootfs 'lib/modules/.*/cfg80211\.ko' 'cfg80211 kernel module'
          require_rootfs 'lib/modules/.*/mac80211\.ko' 'mac80211 kernel module'
          require_rootfs 'lib/modules/.*/mt76\.ko' 'mt76 core module'
          require_rootfs 'lib/modules/.*/mt7915e\.ko' 'MT7981 mt76 radio module'
          require_rootfs 'lib/firmware/mediatek/mt7981_rom_patch\.bin' 'MT7981 ROM patch firmware'
          require_rootfs 'lib/firmware/mediatek/mt7981_wa\.bin' 'MT7981 WA firmware'
          require_rootfs 'lib/firmware/mediatek/mt7981_wm\.bin' 'MT7981 WM firmware'
          require_rootfs 'lib/firmware/mediatek/mt7981_wo\.bin' 'MT7981 WO firmware'
          require_rootfs 'lib/netifd/wireless/mac80211\.sh' 'mac80211 netifd integration'
          require_rootfs 'lib/wifi/mac80211\.uc' 'mac80211 default wireless generator'
          require_rootfs 'usr/sbin/wpad' 'wpad wireless authenticator'

          # 5G modem, QMI, SMS and serial support
          require_rootfs 'lib/modules/.*/qmi_wwan\.ko' 'QMI WWAN kernel module'
          require_rootfs 'lib/modules/.*/qmi_wwan_q\.ko' 'Quectel QMI kernel module'
          require_rootfs 'lib/modules/.*/option\.ko' 'USB serial option module'
          require_rootfs 'lib/modules/.*/usb_wwan\.ko' 'USB WWAN serial module'
          require_rootfs 'sbin/uqmi' 'uqmi command'
          require_rootfs 'usr/bin/sms_tool' 'sms_tool command'
          require_rootfs 'usr/bin/rsrp2rssi' 'RSRP to RSSI helper'
          require_rootfs 'bin/sendat' 'sendat command'
          require_rootfs 'etc/init\.d/modeminit' 'modem init service'
          require_rootfs 'etc/uci-defaults/99-v12-defaults\.sh' 'C8 first-boot defaults'
          require_rootfs 'etc/config/modem' 'modem UCI config'
          require_rootfs 'etc/config/sms_tool' 'sms UCI config'
          require_rootfs 'usr/share/modem/rm520n\.sh' 'RM520N modem init script'

          # LuCI shell and expected pages
          require_rootfs 'www/cgi-bin/luci' 'LuCI CGI entrypoint'
          require_rootfs 'usr/share/luci/menu\.d/luci-base\.json' 'LuCI base menu'
          require_rootfs 'usr/share/luci/menu\.d/luci-mod-status\.json' 'LuCI status menu'
          require_rootfs 'usr/share/luci/menu\.d/luci-mod-system\.json' 'LuCI system menu'
          require_rootfs 'usr/share/luci/menu\.d/luci-mod-network\.json' 'LuCI network menu'
          require_rootfs 'www/luci-static/resources/view/network/wireless\.js' 'LuCI wireless page'
          require_rootfs 'www/luci-static/resources/view/network/interfaces\.js' 'LuCI interfaces page'
          require_rootfs 'usr/share/luci/menu\.d/luci-app-firewall\.json' 'LuCI firewall app'
          require_rootfs 'usr/share/luci/menu\.d/luci-app-nlbwmon\.json' 'LuCI nlbwmon app'
          require_rootfs 'usr/share/luci/menu\.d/luci-app-package-manager\.json' 'LuCI package manager app'
          require_rootfs 'usr/share/luci/menu\.d/luci-app-partexp\.json' 'LuCI partition expansion app'
          require_rootfs 'usr/share/luci/menu\.d/luci-app-ttyd\.json' 'LuCI ttyd app'
          require_rootfs 'usr/share/luci/menu\.d/luci-app-upnp\.json' 'LuCI UPnP app'
          require_rootfs 'usr/share/luci/menu\.d/luci-app-wol\.json' 'LuCI Wake-on-LAN app'
          require_rootfs 'usr/bin/cellscan\.sh' 'C8 base station scan helper'
          require_rootfs 'usr/share/luci/menu\.d/luci-app-c8modem\.json' 'C8 modem LuCI JS menu'
          require_rootfs 'usr/share/rpcd/acl\.d/luci-app-c8modem\.json' 'C8 modem LuCI ACL'
          require_rootfs 'www/luci-static/resources/view/c8modem/status\.js' 'C8 modem JS status page'
          require_rootfs 'www/luci-static/resources/view/c8modem/settings\.js' 'C8 modem JS settings page'
          require_rootfs 'www/luci-static/resources/view/c8modem/wifi\.js' 'C8 wireless status JS page'
          require_rootfs 'www/luci-static/resources/view/c8modem/at\.js' 'C8 modem JS AT page'
          require_rootfs 'www/luci-static/resources/view/c8modem/cellscan\.js' 'C8 base station scan JS page'
          require_rootfs 'www/luci-static/resources/view/c8modem/bands\.js' 'C8 band tool JS page'
          require_rootfs 'www/luci-static/resources/view/c8modem/sms-read\.js' 'C8 SMS JS read page'
          require_rootfs 'www/luci-static/resources/view/c8modem/sms-send\.js' 'C8 SMS JS send page'
          require_rootfs 'www/luci-static/resources/view/c8modem/sms-settings\.js' 'C8 SMS JS settings page'
          require_rootfs 'www/luci-static/resources/view/status(.*/)?10_system\.js' 'LuCI system status JS'

          reject_rootfs() {
            local pattern="$1"
            local desc="$2"
            if grep -Eq "$pattern" "$ROOTFS_LIST"; then
              echo "::error::Unexpected legacy file in rootfs: $desc ($pattern)"
              grep -E "$pattern" "$ROOTFS_LIST" || true
              exit 1
            fi
            echo "OK: no $desc"
          }

          reject_rootfs 'usr/lib/lua/luci/model/cbi/smsconfig\.lua' 'legacy LuCI SMS config CBI'
          reject_rootfs 'usr/lib/lua/luci/c8modem/safe\.lua' 'legacy C8 LuCI Lua helper'
          reject_rootfs 'usr/lib/lua/luci/controller/sms\.lua' 'legacy C8 SMS LuCI API controller'
          reject_rootfs 'usr/lib/lua/luci/controller/modem\.lua' 'legacy C8 modem LuCI API controller'
          reject_rootfs 'usr/lib/lua/luci/model/cbi/modem\.lua' 'legacy C8 modem settings CBI'
          reject_rootfs 'usr/lib/lua/luci/view/zmode/net_status\.htm' 'legacy C8 modem status view'
          reject_rootfs 'usr/lib/lua/luci/view/zmode/at\.htm' 'legacy C8 modem AT view'
          reject_rootfs 'usr/lib/lua/luci/view/modem/readsms\.htm' 'legacy LuCI read SMS view'
          reject_rootfs 'usr/lib/lua/luci/view/modem/sendsms\.htm' 'legacy LuCI send SMS view'
          reject_rootfs 'usr/share/rpcd/acl\.d/luci-app-sms-tool\.json' 'legacy LuCI SMS ACL'

          STATUS_PATHS="$(sed -n 's#.*squashfs-root/\(www/luci-static/resources/view/status.*/10_system\.js\)$#\1#p' "$ROOTFS_LIST")"
          if [ -z "$STATUS_PATHS" ]; then
            echo "::error::LuCI system status JS was not found in firmware rootfs"
            exit 1
          fi
          STATUS_MARKER_COUNT=0
          while IFS= read -r STATUS_PATH; do
            [ -n "$STATUS_PATH" ] || continue
            STATUS_TEXT="$("$UNSQUASHFS" -cat "$ROOTFS" "$STATUS_PATH")"
            CURRENT_MARKER_COUNT="$(printf '%s' "$STATUS_TEXT" | grep -o " / $WRT_MARK-" | wc -l | tr -d '[:space:]')"
            STATUS_MARKER_COUNT=$((STATUS_MARKER_COUNT + CURRENT_MARKER_COUNT))
            if [ "$CURRENT_MARKER_COUNT" -gt 0 ] && ! printf '%s' "$STATUS_TEXT" | grep -q " / $WRT_MARK-$WRT_DATE"; then
              echo "::error::LuCI status marker in $STATUS_PATH is stale"
              printf '%s\n' "$STATUS_TEXT" | grep -o "$WRT_MARK-[^']*" || true
              exit 1
            fi
          done <<< "$STATUS_PATHS"
          if [ "$STATUS_MARKER_COUNT" -ne 1 ]; then
            echo "::error::expected exactly one LuCI build marker in rootfs, found $STATUS_MARKER_COUNT"
            for STATUS_PATH in $STATUS_PATHS; do
              "$UNSQUASHFS" -cat "$ROOTFS" "$STATUS_PATH" | grep -o "$WRT_MARK-[^']*" || true
            done
            exit 1
          fi
          echo "OK: LuCI build marker is current and unique"

          ROOT_SHADOW="$("$UNSQUASHFS" -cat "$ROOTFS" etc/shadow | sed -n 's/^root:\([^:]*\):.*/\1/p')"
          if [ -z "$ROOT_SHADOW" ]; then
            echo "::error::root password hash is empty in firmware rootfs"
            exit 1
          fi
          echo "OK: root password hash is set"

          MODEM_SIMSEL="$("$UNSQUASHFS" -cat "$ROOTFS" etc/config/modem | sed -n "s/^[[:space:]]*option[[:space:]]\\+simsel[[:space:]]\\+'\\([^']*\\)'.*/\\1/p" | head -1)"
          if [ "$MODEM_SIMSEL" != "0" ]; then
            echo "::error::modem default simsel should be 0 (external SIM), got '$MODEM_SIMSEL'"
            exit 1
          fi
          echo "OK: modem default SIM is external"

      - name: Cleanup Old Releases
        if: ${{ inputs.publish_release }}
        run: |
          KEEP="${{ inputs.keep_releases }}"
          case "$KEEP" in
            ''|*[!0-9]*) KEEP=3 ;;
          esac
          RELEASES=$(gh release list --json tagName,publishedAt --limit 100 --jq '
            [
              .[] | select(
                (.tagName | startswith("c8-660-open-")) or
                ((.tagName | startswith("immortalwrt-c8-660-")) and ((.tagName | startswith("immortalwrt-c8-660-closed-")) | not)) or
                (.tagName | startswith("NRADIO-C8-660-immortalwrt-master-"))
              )
            ] | sort_by(.publishedAt) | .[0:-'"$KEEP"'] | .[].tagName
          ' 2>/dev/null) || true
          for TAG in $RELEASES; do
            echo "Deleting release and tag: $TAG"
            gh release delete "$TAG" --yes 2>/dev/null || true
            git push --delete origin "$TAG" 2>/dev/null || true
          done
          echo "Cleanup done (kept last $KEEP releases)"

      - name: Release Firmware
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          tag_name: ${{env.RELEASE_TAG}}
          name: C8-660 Open (mt76) ${{env.RELEASE_DATE}} ${{env.RELEASE_TIME}}
          fail_on_unmatched_files: true
          files: |
            ./wrt/upload/immortalwrt-c8-660-factory.bin
            ./wrt/upload/immortalwrt-c8-660-sysupgrade.bin
            ./wrt/upload/immortalwrt-c8-660-initramfs.bin
            ./wrt/upload/mt7981-bl2.bin
            ./wrt/upload/*.manifest
            ./wrt/upload/sha256sums
          body: |
            ## C8-660 Open 固件

            **下载**
            - 首次刷入：`immortalwrt-c8-660-factory.bin`
            - 系统升级：`immortalwrt-c8-660-sysupgrade.bin`
            - 校验文件：`sha256sums`

            **构建**
            - 类型：Open / mt76 / mainline
            - 时间：${{env.RELEASE_DATE}} ${{env.RELEASE_TIME}} Asia/Shanghai
            - 源码：${{env.WRT_REPO}} (${{env.WRT_BRANCH}}) @ ${{env.WRT_HASH}}
            - 内核：${{env.WRT_KVER}}
            - 地址：${{env.WRT_IP}}

            **重要**
            - 首次刷入会替换原厂系统，请先备份 BL2 / FIP。
            - Open 与 Closed 固件不通用。
            - 详细刷机说明见 [README](https://github.com/${{github.repository}}#使用流程)。

      - name: Upload Firmware Artifact
        if: ${{ inputs.publish_release == false }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: firmware-${{env.WRT_CONFIG}}-${{env.WRT_DATE}}
          path: ./wrt/upload/
          retention-days: 7
          if-no-files-found: error

      - name: Clean Build Workspace
        if: always()
        run: |
          cd ./wrt/
          if [ -f .config ]; then
            make clean -j$(nproc)
          else
            echo "Skip make clean: .config not generated"
          fi

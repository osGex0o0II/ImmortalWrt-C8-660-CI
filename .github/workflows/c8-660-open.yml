            reject_rootfs 'www/luci-static/resources/view/package-manager\.js' 'LuCI package manager view'
            reject_rootfs 'usr/share/rpcd/acl\.d/luci-app-package-manager\.json' 'LuCI package manager ACL'
            reject_rootfs 'usr/libexec/package-manager-call' 'LuCI package manager backend'
          fi
          if config_enabled 'luci-app-partexp'; then
